<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Иврит с ИИ — интерактивные таблицы иврита</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:#111}
body{overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
.shell-header{flex:0 0 auto;background:#fff;border-bottom:1px solid #cfcfcf;z-index:1000}
.topbar{min-height:74px;display:grid;grid-template-columns:minmax(0,1fr) 42px;align-items:center;gap:8px;padding:5px 8px;max-width:430px;margin:0 auto}
.menu-wrap{position:relative;justify-self:end}
.menu-btn,.help-btn{border:1px solid #888;background:#fff;border-radius:8px;height:36px;min-width:36px;font-size:22px;cursor:pointer}
.title{font-size:20px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.right-actions{display:none!important}
.auth-btn{border:0;background:transparent;font-size:15px;cursor:pointer;padding:6px 4px;white-space:nowrap}
.main-menu{display:none;position:absolute;top:42px;right:0;left:auto;width:310px;background:#fff;border:1px solid #aaa;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.18);overflow:hidden;z-index:1100}
.main-menu.open{display:block}
.main-menu button{display:block;width:100%;border:0;border-bottom:1px solid #e5e5e5;background:#fff;padding:12px 14px;text-align:left;font-size:16px;cursor:pointer}
.main-menu button:last-child{border-bottom:0}
.main-menu button.active{background:#f1f1f1}
.langbar{display:none!important}
.lang-btn{border:0;background:transparent;font-size:20px;cursor:pointer;padding:2px 0}
.lang-btn.active{}
.sep{color:#555}

.menu-sep{height:1px;background:#e5e5e5;margin:2px 0}
.menu-label{padding:9px 14px 5px;font-size:13px;color:#555}
.menu-langs{display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 12px 11px;border-bottom:1px solid #e5e5e5}
.menu-langs .lang-btn{font-size:19px}
.menu-action{}
.menu-action.auth{}
.content{flex:1 1 auto;min-height:0;position:relative;background:#fff}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
.frame.active{display:block}
.welcome{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto;background:#fff}
.welcome-card{width:min(100%,400px);border:1px solid #ddd;border-radius:14px;padding:18px;background:#fafafa;text-align:center}
.welcome-card h1{font-size:23px;margin:0 0 10px;}
.welcome-card p{font-size:15px;line-height:1.4;margin:8px 0}
.welcome-card button{margin-top:10px;border:2px solid #111;border-radius:10px;background:#fff;padding:10px 18px;font-size:17px;cursor:pointer}
.help-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:2000;padding:70px 12px 12px}
.help-modal.open{display:flex;align-items:flex-start;justify-content:center}
.help-card{width:min(100%,400px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;border:1px solid #888;border-radius:14px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.help-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.help-title{font-size:20px;}
.close-help{border:1px solid #aaa;border-radius:8px;background:#fff;font-size:22px;width:34px;height:34px;cursor:pointer}
.help-card h3{font-size:17px;margin:12px 0 5px;}
.help-card p{font-size:15px;line-height:1.4;margin:5px 0;}
@media(max-width:370px){
 .title{font-size:18px}
 .topbar{grid-template-columns:minmax(0,1fr) 40px;padding-left:5px;padding-right:5px}
 .main-menu{width:min(310px,calc(100vw - 20px))}
 .lang-btn{font-size:19px}
}

/* Единая жёлтая ячейка: разделы + список + справка. */
.title{display:none!important}
.menu-wrap{display:none!important}
.topbar{
  min-height:78px!important;
  display:flex!important;
  justify-content:center!important;
  padding:6px 8px!important;
}
.section-cell{
  position:relative;
  width:min(100%,390px);
  min-height:66px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 38px 44px 38px;
  align-items:stretch;
  gap:0;
  background:#fff2a8;
  border:2px solid #d1ad28;
  border-radius:10px;
  overflow:visible;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.quick-sections{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:center;
  gap:0;
  min-width:0;
  padding:4px 8px;}
.quick-section{
  border:0;
  background:transparent;
  color:#000;
  padding:3px 2px;font-size:16px;line-height:1.15;
  text-align:left;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;}
.quick-section.active{color:#0b69c7;}
.list-arrow{
  border:0;
  border-left:1px solid rgba(0,0,0,.18);
  background:transparent;
  color:#111;
  font-size:24px;
  cursor:pointer;
}

.lang-drop-wrap{
  position:relative;
  display:flex;
  min-width:0;
}

.shell-home-back{
  width:100%;
  height:100%;
  border:0;
  border-left:1px solid rgba(0,0,0,.18);
  background:transparent;
  color:#111;
  font-size:28px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.shell-home-back:active{transform:scale(.96)}
.lang-drop-btn{
  width:100%;
  height:100%;
  border:0;
  border-left:1px solid rgba(0,0,0,.18);
  background:transparent;
  color:#111;
  font-size:23px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.lang-drop-menu{
  display:none;
  position:absolute;
  right:0;
  top:calc(100% + 5px);
  z-index:1850;
  width:170px;
  background:#fff;
  border:1px solid #9c8b45;
  border-radius:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.20);
  overflow:hidden;
}
.lang-drop-menu.open{display:block}
.lang-drop-menu button{
  display:block;
  width:100%;
  border:0;
  border-bottom:1px solid #e7e7e7;
  background:#fff;
  color:#000;
  padding:10px 12px;
  text-align:left;font-size:15px;line-height:1.2;
  cursor:pointer;
}
.lang-drop-menu button:last-child{border-bottom:0}
.lang-drop-menu button.active{
  background:#fff2a8;
}

.quick-help{
  display:flex!important;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  border:0;
  border-left:1px solid rgba(0,0,0,.18);
  border-radius:0 8px 8px 0;
  background:transparent;
  color:#000;font-size:22px;line-height:1;
  cursor:pointer;
}
.saved-dropdown{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 5px);
  z-index:1800;
  max-height:52vh;
  overflow:auto;
  background:#fff;
  border:1px solid #9c8b45;
  border-radius:10px;
  box-shadow:0 10px 24px rgba(0,0,0,.20);
  padding:5px;
}
.saved-dropdown.open{display:block}
.saved-list-title{
  padding:7px 10px 9px;
  text-align:center;
  font-size:17px;
  border-bottom:1px solid #d9d9d9;
  margin-bottom:5px;
  background:#fff;}
.saved-empty{padding:12px;text-align:center;font-size:14px;color:#555}
.saved-row{
  display:grid;
  grid-template-columns:32px minmax(0,1fr);
  gap:5px;
  align-items:stretch;
  margin:0 0 4px;
}
.saved-row:last-child{margin-bottom:0}
.saved-del{
  border:1px solid #999;
  border-radius:7px;
  background:#fff;
  font-size:23px;
  cursor:pointer;
}
.saved-open{
  border:1px solid #ddd;
  border-radius:7px;
  background:#fff;
  padding:4px 7px;
  cursor:pointer;
  text-align:center;
  overflow:hidden;
}
.saved-tr{
  display:block;
  font-size:14px;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;}
.saved-he{
  display:block;
  font-size:25px;
  direction:rtl;
  line-height:1.1;
}
.welcome{display:none!important}
@media(max-width:370px){
  .topbar{min-height:74px!important}
  .section-cell{grid-template-columns:minmax(0,1fr) 34px 40px 34px;min-height:62px}
  .quick-section{font-size:14px;}
  .list-arrow{font-size:21px}
  .quick-help{font-size:20px}
}

/* === Главная страница «Иврит с ИИ» === */
body.home-mode .shell-header{display:none!important}
body.home-mode .frame{display:none!important}
body.home-mode .welcome{display:flex!important}
.welcome{display:none!important;position:absolute;inset:0;align-items:flex-start;justify-content:center;padding:24px 18px;overflow:auto;background:#fff}
.home-card{width:min(100%,560px);margin:auto 0;border:0;border-radius:0;padding:6px 0 10px;background:#fff;box-shadow:none;text-align:center}
.home-brand{font-size:26px;line-height:1.05;margin:0 0 6px;color:#111;}
.home-he{font-size:33px;direction:rtl;line-height:1.1;margin:0;color:#0b69c7}
.home-he-row{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:0 0 18px;}
.home-he-row .home-he{margin:0;}
.home-he-translation{max-width:390px;font-size:15px;line-height:1.12;color:#3f3f3f;text-align:center;}
.home-subtitle{font-size:17px;line-height:1.35;margin:8px 0 18px;color:#444}
.home-lang-label{font-size:15px;font-weight:700;line-height:1.2;margin:0 0 7px;color:#444;text-align:center}
.home-lang{display:flex;justify-content:center;gap:11px;margin:0 0 23px}
.home-lang button{min-width:72px;height:53px;border:1px solid #d7b432;background:#fff;border-radius:13px;padding:7px 15px;font-size:24px;cursor:pointer}
.home-lang button.active{background:#fff2a8;border-color:#d1ad28}
.home-actions{display:grid;gap:16px;width:min(100%,500px);margin:0 auto}
.home-bottom-space{height:48px;flex:0 0 48px}
.home-action{width:100%;min-height:74px;border:2px solid #d9aa13;border-radius:20px;background:#fff8cf;color:#111;padding:10px 42px 10px 18px;cursor:pointer;text-align:left}
.home-action:hover{background:#fff2a8}
.home-action-title{display:block;font-size:15px;line-height:1.15;}
.home-action-text{display:block;font-size:14px;line-height:1.25;margin-top:5px;color:#555;}
.home-ai-note{margin:16px 4px 0;font-size:13px;line-height:1.4;color:#666}
.home-mark{display:inline-flex;align-items:center;gap:6px;color:#0b69c7}
.home-open-icon{float:right;font-size:24px;line-height:1;margin-right:0}
.home-return{position:absolute;left:8px;top:8px;z-index:1700;border:0;background:transparent;font-size:24px;cursor:pointer;display:none}
body:not(.home-mode) .home-return{display:none}
@media(max-width:600px){
  .welcome{padding:18px 20px}
  .home-card{width:100%;padding:4px 0 10px}
  .home-brand{font-size:26px;}
  .home-he{font-size:33px;}
  .home-he-translation{max-width:360px;font-size:15px;}
  .home-lang button{min-width:70px;height:52px;font-size:24px}
  .home-action{min-height:72px;padding:9px 40px 9px 16px}
  .home-action-title{font-size:15px;}
  .home-action-text{font-size:14px;}
}

</style>

<style id="site-typography-system">
/* === Единая система шрифтов: один источник для всей страницы === */
:root{

<script>
(function(){
"use strict";
var frames={verbs:document.getElementById("verbsFrame"),preps:document.getElementById("prepsFrame"),examples:document.getElementById("examplesFrame"),roots:document.getElementById("rootsFrame"),reading:document.getElementById("readingFrame")};
frames.verbs.src="verbs.html";
frames.preps.src="preps.html";
frames.examples.src="verb_examples.html";
frames.roots.src="roots.html";
frames.reading.src="reading.html";
var examplesMode="verbs";

function ensureExamplesMode(mode,done){
  mode=(mode==="preps")?"preps":"verbs";
  var frame=frames.examples;
  if(!frame){ if(done)done(); return; }

  function ready(){
    try{ syncLangToFrame(frame); }catch(_e){}
    if(done)done();
  }

  var win=null;
  try{win=frame.contentWindow;}catch(_e){}

  var apiReady = mode==="preps"
    ? (win && typeof win.shellOpenPrepExamples==="function")
    : (win && typeof win.shellOpenVerbExamples==="function");

  if(examplesMode===mode && apiReady && mode!=="preps"){
    ready();
    return;
  }

  /* Для Примеров предлогов каждый клик открывает чистую страницу,
     чтобы предыдущая таблица/экран не оставались. */
  examplesMode=mode;
  frame.addEventListener("load",function onModeLoad(){
    frame.removeEventListener("load",onModeLoad);
    setTimeout(ready,20);
  });
  frame.src=(mode==="preps" ? "prep_examples.html" : "verb_examples.html");
}

var lang=localStorage.getItem("hebrewUnifiedLang")||"ru";
if(!/^(ru|uk|en)$/.test(lang)) lang="ru";
var section="verbs";
var homeSectionGroup="all";
var loggedIn=true;
var selectedVerbForExamples=null;
function verbInfoFromCard(card){
  if(!card)return null;
  return {base:(card.dataset.base||'').trim(),he:(card.dataset.he||'').trim(),ru:(card.dataset.ru||'').trim(),uk:(card.dataset.uk||'').trim(),en:(card.dataset.en||'').trim()};
}
function rememberSelectedVerb(){
  try{
    var doc=frames.verbs.contentDocument, win=frames.verbs.contentWindow, card=null, base='';
    if(!doc)return selectedVerbForExamples;
    /* Введённый пользователем глагол имеет приоритет над старой active-карточкой.
       Это важно для глагола, которого ещё нет в базе: в «Примерах» нельзя
       показывать примеры предыдущего выбранного глагола. */
    var search=doc.getElementById('verbSearch');
    var typed=search&&String(search.value||'').trim();
    if(typed){
      var normTyped=typed.toLowerCase().replace(/[\u0591-\u05C7]/g,'').trim();
      var exact=null;
      var all=doc.querySelectorAll('#verbsPanel .verb');
      for(var ti=0;ti<all.length;ti++){
        var c=all[ti], vals=[c.dataset.base,c.dataset.he,c.dataset.ru,c.dataset.uk,c.dataset.en];
        for(var vi=0;vi<vals.length;vi++){
          var nv=String(vals[vi]||'').toLowerCase().replace(/[\u0591-\u05C7]/g,'').trim();
          if(nv&&nv===normTyped){exact=c;break;}
        }
        if(exact)break;
      }
      if(exact){ selectedVerbForExamples=verbInfoFromCard(exact); return selectedVerbForExamples; }
      selectedVerbForExamples={base:'',he:'',ru:typed,uk:'',en:''};
      return selectedVerbForExamples;
    }
    try{base=(win&&win.localStorage&&win.localStorage.getItem('lastVerbBase_m39'))||'';}catch(_e){}
    if(base){
      var cards=doc.querySelectorAll('#verbsPanel .verb[data-base]');
      for(var ci=0;ci<cards.length;ci++){if((cards[ci].dataset.base||'')===base){card=cards[ci];break;}}
    }
    if(!card)card=doc.querySelector('#verbsPanel .verb.active');
    if(card)selectedVerbForExamples=verbInfoFromCard(card);
  }catch(_e){}
  return selectedVerbForExamples;
}
function bindVerbSelectionTracking(){
  try{
    var doc=frames.verbs.contentDocument;if(!doc||doc.__shellExamplesTracked)return;
    doc.__shellExamplesTracked=true;
    doc.addEventListener('click',function(e){
      var card=e.target&&e.target.closest&&e.target.closest('#verbsPanel .verb');
      if(card)selectedVerbForExamples=verbInfoFromCard(card);
      else if(e.target&&e.target.closest&&e.target.closest('.verb-search-item'))setTimeout(rememberSelectedVerb,120);
    },true);
    setTimeout(rememberSelectedVerb,100);
  }catch(_e){}
}

function simplifyEmbeddedFrame(frame){
  try{
    var doc=frame.contentDocument;if(!doc)return;
    if(doc.getElementById("unified-hide-inner-header")) return;
    var st=doc.createElement("style");
    st.id="unified-hide-inner-header";
    st.textContent='.mobile-header{display:none!important}.mobile-app{height:100vh!important;min-height:100vh!important}.seo-text{display:none!important}';
    doc.head.appendChild(st);
  }catch(e){}
}

function syncLangToFrame(frame){
  try{
    var doc=frame.contentDocument;if(!doc)return;
    var win=frame.contentWindow;
    simplifyEmbeddedFrame(frame);

    // Сначала используем публичную функцию встроенного раздела. Это важно для
    // глаголов: её финальный обработчик языка намеренно останавливает старые
    // click-обработчики, поэтому простой btn.click() не всегда обновлял открытую таблицу.
    if(win && typeof win.applyCleanLanguage==="function"){
      win.applyCleanLanguage(lang,true);
    }else{
      var selectors=['.pred-lang-btn[data-lang="'+lang+'"]','.lang-btn[data-lang="'+lang+'"]','button[data-lang="'+lang+'"]'];
      var btn=null;
      for(var i=0;i<selectors.length&&!btn;i++) btn=doc.querySelector(selectors[i]);
      if(btn) btn.click();
    }

    var sel=doc.querySelector('#langSelect,#langSelectect,select[name="lang"]');
    if(sel){sel.value=lang;sel.dispatchEvent(new Event("change",{bubbles:true}));}

    // Если таблица спряжения уже открыта — открываем ту же карточку заново,
    // чтобы переводы всех форм, заголовки времён и интерфейс сменились сразу.
    if(frame===frames.verbs && win){
      setTimeout(function(){
        try{
          if(typeof win.applyCleanLanguage==="function") win.applyCleanLanguage(lang,true);
          var panel=doc.getElementById("verbsPanel");
          if(panel && panel.classList.contains("table-open")){
            var base="";
            try{base=win.localStorage.getItem("lastVerbBase_m39")||"";}catch(_e){}
            var card=base ? doc.querySelector('#verbsPanel .verb[data-base="'+(win.CSS&&win.CSS.escape?win.CSS.escape(base):base.replace(/"/g,'\\"'))+'"]') : null;
            if(!card) card=doc.querySelector('#verbsPanel .verb.active,#verbsPanel .verb.new-top');
            if(card && typeof win.openInfinitiveCard==="function") win.openInfinitiveCard(card);
            else if(card && typeof win.renderTable==="function") win.renderTable(card);
          }
          if(typeof win.refreshTriLangCompact==="function") win.refreshTriLangCompact();
        }catch(_err){}
      },80);
    }
  }catch(e){}
}
window.shellAddPrepFromExamples=function(key,data){

    if(w&&typeof w.shellAddPrepFromExamples==="function"){

};

function syncAllLang(){syncLangToFrame(frames.verbs);syncLangToFrame(frames.preps);syncLangToFrame(frames.examples);syncLangToFrame(frames.roots);syncLangToFrame(frames.reading)}


function getFrameDoc(){
  try{return frames[section] && frames[section].contentDocument;}catch(e){return null;}
}
var SAVED_LIST_HIDDEN_KEY="hebrewUnifiedHiddenListItemsV1";

function readHiddenListItems(){
  try{
    var x=JSON.parse(localStorage.getItem(SAVED_LIST_HIDDEN_KEY)||"{}");
    return x&&typeof x==="object"?x:{};
  }catch(_e){return {};}
}
function savedListIdentity(kind,key,he){
  return String(kind||"")+"|"+String(key||he||"").trim();
}
function hideOnlyFromSavedList(kind,key,he){
  var hidden=readHiddenListItems();
  hidden[savedListIdentity(kind,key,he)]=1;
  try{localStorage.setItem(SAVED_LIST_HIDDEN_KEY,JSON.stringify(hidden));}catch(_e){}
}

function collectSavedItems(){
  var doc=getFrameDoc(), items=[], hidden=readHiddenListItems();
  if(!doc) return items;
  if(section==="verbs"){
    doc.querySelectorAll("#verbsPanel .verb").forEach(function(card,index){
      var tr=card.querySelector(".translation");
      var he=card.querySelector(".hebrew");
      if(!he) return;
      var key=(card.getAttribute("data-base")||"").trim();
      var heText=(he.textContent||"").trim();
      if(hidden[savedListIdentity("verb",key,heText)]) return;
      items.push({
        kind:"verb", index:index, key:key,
        tr:(function(){
          var attrName = lang==="uk" ? "data-uk" : (lang==="en" ? "data-en" : "data-ru");
          var direct = (card.getAttribute(attrName)||"").trim();
          if(direct) return direct;
          if(!tr) return "";
          var tt=tr.querySelector(".translation-text");
          return (tt ? tt.textContent : tr.textContent || "").replace(/^\s*[−–—-]\s*/, "").trim();
        })(),
        he:heText
      });
    });
  }else if(section==="roots"){
    try{
      var rw=frames.roots&&frames.roots.contentWindow;
      var raw=rw&&rw.localStorage ? rw.localStorage.getItem("hebrewRootsDBCustomV2") : null;
      var roots=raw ? JSON.parse(raw) : {};
      Object.keys(roots||{}).forEach(function(root,index){
        var rec=roots[root];
        if(!rec || rec.__aiSaved!==true) return;
        if(hidden[savedListIdentity("root",root,root)]) return;
        var bins=Array.isArray(rec.bins)?rec.bins:[];
        var tr=bins.map(function(b){
          return (lang==="uk" ? b.uk : (lang==="en" ? b.en : b.ru)) || "";
        }).filter(Boolean).join(", ");
        items.push({kind:"root",index:index,key:root,tr:tr,he:root});
      });
    }catch(_e){}
  }else{
    doc.querySelectorAll(".prep-list-row").forEach(function(row,index){
      var card=row.querySelector(".prep-card");
      if(!card) return;
      var tr=card.querySelector(".translation");
      var he=card.querySelector(".hebrew");
      var key=(row.getAttribute("data-prep-key")||card.getAttribute("data-prep-key")||"").trim();
      var heText=(he&&he.textContent||"").trim();
      if(hidden[savedListIdentity("prep",key,heText)]) return;
      items.push({
        kind:"prep", index:index, key:key,
        tr:(tr&&tr.textContent||"").trim(),
        he:heText
      });
    });
  }
  return items;
}
function renderSavedDropdown(){
  var box=document.getElementById("savedDropdown");
  if(!box) return;
  var items=collectSavedItems();
  var listTitle = section==="verbs"
    ? (lang==="uk" ? "Список дієслів" : (lang==="en" ? "Verb list" : "Список глаголов"))
    : section==="roots"
      ? (lang==="uk" ? "Список коренів" : (lang==="en" ? "Root list" : "Список корней"))
      : (lang==="uk" ? "Список прийменників і слів" : (lang==="en" ? "Prepositions and words list" : "Список предлогов и слов"));
  var head='<div class="saved-list-title">'+escapeShell(listTitle)+'</div>';
  if(!items.length){
    box.innerHTML=head+'<div class="saved-empty">'+(lang==="uk"?"Список порожній":(lang==="en"?"The list is empty":"Список пуст"))+'</div>';
    return;
  }
  box.innerHTML=head+items.map(function(x){
    return '<div class="saved-row" data-kind="'+x.kind+'" data-index="'+x.index+'" data-key="'+escapeShell(x.key||"")+'" data-he="'+escapeShell(x.he||"")+'">'+
      '<button type="button" class="saved-del" title="'+(lang==="uk"?"Видалити зі списку":(lang==="en"?"Remove from list":"Удалить из списка"))+'">−</button>'+
      '<button type="button" class="saved-open"><span class="saved-tr">'+escapeShell(String(x.tr||"").replace(/^\s*[−–—-]\s*/, ""))+'</span><span class="saved-he">'+escapeShell(x.he)+'</span></button>'+
      '</div>';
  }).join("");
}
function escapeShell(s){
  return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}
function openSavedItem(kind,index,key){
  var doc=getFrameDoc(); if(!doc) return;
  if(kind==="verb"){
    var cards=doc.querySelectorAll("#verbsPanel .verb");
    if(cards[index]) cards[index].click();
  }else if(kind==="root"){
    try{
      var rd=frames.roots&&frames.roots.contentDocument;
      var inp=rd&&rd.getElementById("rootInput");
      if(inp){
        inp.value=key||"";
        inp.dispatchEvent(new Event("input",{bubbles:true}));
        inp.dispatchEvent(new Event("change",{bubbles:true}));
      }
    }catch(_e){}
  }else{
    var rows=doc.querySelectorAll(".prep-list-row");
    var card=rows[index]&&rows[index].querySelector(".prep-card");
    if(card) card.click();
  }
}
function deleteSavedItem(kind,index,key,he){
  /* Для корней знак минус удаляет введённый пользователем корень из сохранённой rootsDB. */
  if(kind==="root"){
    try{
      var rw=frames.roots&&frames.roots.contentWindow;
      var raw=rw&&rw.localStorage ? rw.localStorage.getItem("hebrewRootsDBCustomV2") : null;
      var roots=raw ? JSON.parse(raw) : {};
      if(roots && roots[key] && roots[key].__aiSaved===true){
        delete roots[key];
        rw.localStorage.setItem("hebrewRootsDBCustomV2",JSON.stringify(roots));
        /* Перезагружаем только экран корней, чтобы его внутренняя база перечиталась. */
        frames.roots.src="roots.html";
      }
    }catch(_e){}
    renderSavedDropdown();
    return;
  }

  /* Для остальных разделов удаляем только из списка. Таблица в базе остаётся нетронутой. */
  hideOnlyFromSavedList(kind,key,he);

  if(kind==="prep"){
    try{
      var w=frames.preps&&frames.preps.contentWindow;
      if(w&&typeof w.shellHidePrepOnlyFromList==="function"){
        w.shellHidePrepOnlyFromList(key);
      }
    }catch(_e){}
  }

  renderSavedDropdown();
}

function restoreSavedListItem(kind,key,he){
  var hidden=readHiddenListItems(), id=savedListIdentity(kind,key,he);
  if(hidden[id]){
    delete hidden[id];
    try{localStorage.setItem(SAVED_LIST_HIDDEN_KEY,JSON.stringify(hidden));}catch(_e){}
  }
  renderSavedDropdown();
}
window.restoreSavedListItem=restoreSavedListItem;

function closeSavedDropdown(){
  var box=document.getElementById("savedDropdown"),btn=document.getElementById("savedListBtn");
  if(box) box.classList.remove("open");
  if(btn) btn.setAttribute("aria-expanded","false");
}

function selectedPrepForExamples(){
  try{
    var doc=frames.preps.contentDocument;
    if(!doc)return null;

    /* The search field has priority: it is exactly what the user is working with. */
    var q=doc.getElementById("verbSearch");
    var typed=q&&q.value?String(q.value).trim():"";
    if(typed)return {query:typed,he:typed};

    var page=doc.querySelector("#conjScreen .prep-page[data-key]");
    if(page){
      var key=page.getAttribute("data-key")||"";
      var he=page.querySelector(".prep-base");
      return {key:key,he:he?he.textContent.trim():""};
    }
  }catch(_e){}
  return null;
}

function selectedExampleForDeclension(){
  try{
    var doc=frames.examples.contentDocument;
    if(!doc)return null;

    /* Again, user's search field is the source of truth. */
    var q=doc.getElementById("verbSearch");
    var typed=q&&q.value?String(q.value).trim():"";
    if(typed)return {query:typed,he:typed};

    /* Fallback: take the Hebrew base currently displayed in Examples. */
    var base=
      doc.querySelector("#conjScreen .examples-full-base .examples-full-speak") ||
      doc.querySelector("#conjScreen .prep-analogue-base .prep-analogue-speak") ||
      doc.querySelector("#conjScreen .prep-base");
    if(base){
      var he=base.getAttribute("data-he")||base.textContent||"";
      he=String(he).trim();
      if(he)return {he:he,query:he};
    }
  }catch(_e){}
  return null;
}


function setHomeSectionGroup(entry){
  if(entry==="verbs" || entry==="roots"){
    homeSectionGroup="verb-family";
  }else if(entry==="preps"){
    homeSectionGroup="prep-family";
  }else if(entry==="reading"){

function showSection(next){
  var fromSection=section;
  var prepInfo=null;
  var declInfo=null;

  if(next==="examples"){
    /* Примеры работают по контексту активного раздела:
       Спряжение -> глагол; Склонение -> предлог/слово. */
    prepInfo=(fromSection==="verbs")
      ? rememberSelectedVerb()
      : (fromSection==="preps" ? selectedPrepForExamples() : null);
  }else if(next==="preps" && fromSection==="examples"){
    declInfo=(examplesMode==="preps") ? selectedExampleForDeclension() : null;
  }

  document.body.classList.remove("home-mode");
  closeSavedDropdown();
  if(typeof closeLangDrop==="function") closeLangDrop();

  section=(next==="preps"||next==="examples"||next==="roots"||next==="reading")?next:"verbs";
  localStorage.setItem("hebrewUnifiedSection",section);

  Object.keys(frames).forEach(function(k){
    frames[k].classList.toggle("active",k===section);
  });

  document.getElementById("welcome").style.display="none";
  updateLabels();

  if(section==="reading"){
    try{ syncLangToFrame(frames.reading); }catch(_e){}
  }

  if(section==="roots"){
    try{ syncLangToFrame(frames.roots); }catch(_e){}
    setTimeout(function(){
      try{ syncLangToFrame(frames.roots); }catch(_e){}
    },30);
  }

  setTimeout(function(){
    /*
      При прямом переходе Спряжение <-> Склонение
      рабочая запись предыдущего экрана НЕ переносится.
      Открывается чистая строка для нового ввода.
      Сохранённые списки и базы при этом не удаляются.
    */
    if((fromSection==="verbs" && section==="preps") ||
       (fromSection==="preps" && section==="verbs")){
      try{
        var rw=frames[section]&&frames[section].contentWindow;
        if(rw && typeof rw.shellResetWorkingScreen==="function"){
          rw.shellResetWorkingScreen();
        }
      }catch(_e){}
    }

    /* Переход в Примеры по источнику. */
    if(section==="examples"){
      if(fromSection==="verbs"){
        ensureExamplesMode("verbs",function(){
          try{
            var ew=frames.examples.contentWindow;
            if(prepInfo && ew && typeof ew.shellOpenVerbExamples==="function"){
              ew.shellOpenVerbExamples(prepInfo);
            }else if(ew && typeof ew.shellFocusVerbExamples==="function"){
              ew.shellFocusVerbExamples();
            }
          }catch(_e){}
        });
      }else if(fromSection==="preps"){
        ensureExamplesMode("preps",function(){
          try{
            var ew=frames.examples.contentWindow;
            if(prepInfo && ew && typeof ew.shellOpenPrepExamples==="function"){
              ew.shellOpenPrepExamples(prepInfo);
            }
          }catch(_e){}
        });
      }
    }

    /* Если возвращаемся из режима примеров предлогов обратно в Склонение,
       можно открыть ту же запись. */
    if(section==="preps" && declInfo){
      try{
        var pw=frames.preps.contentWindow;
        if(pw&&typeof pw.shellOpenPrepDeclension==="function"){
          pw.shellOpenPrepDeclension(declInfo);
        }
      }catch(_e){}
    }
  },100);
}

/* Корни: найти инфинитив по инфинитиву, любой форме спряжения или переводу RU/UK/EN. */
window.resolveRootQueryFromVerbDB=function(q){
  var raw=String(q||"").trim();
  if(!raw)return "";
  try{
    var w=rootVerbFrame(), db=w&&w.verbsDB;
    if(!db)return "";

    function noNiq(v){
      return String(v||"").replace(/[\u0591-\u05C7]/g,"").trim();
    }
    function norm(v){
      return noNiq(v).toLocaleLowerCase().replace(/\s+/g," ").trim();
    }
    var want=norm(raw);
    var wantHe=noNiq(raw).replace(/[^\u05D0-\u05EA]/g,"");

    function rowMatches(row){
      if(!row||typeof row!=="object")return false;
      var vals=[
        row.he,row.ru,row.uk,row.en,
        row.translation,row.fullTranslation,
        row.form,row.hebrew,row.verb
      ];
      if(row.translations&&typeof row.translations==="object"){
        vals.push(row.translations.ru,row.translations.uk,row.translations.en);
      }
      if(row.translation&&typeof row.translation==="object"){
        vals.push(row.translation.ru,row.translation.uk,row.translation.en);
      }
      for(var i=0;i<vals.length;i++){
        var v=vals[i];
        if(v==null||typeof v==="object")continue;
        if(norm(v)===want)return true;
        if(wantHe && noNiq(v).replace(/[^\u05D0-\u05EA]/g,"")===wantHe)return true;
      }
      return false;
    }

    var keys=Object.keys(db);
    for(var i=0;i<keys.length;i++){
      var k=keys[i], rec=db[k]||{}, inf=rec.infinitive||{};
      if(norm(k)===want || norm(inf.he)===want || norm(inf.ru)===want ||
         norm(inf.uk)===want || norm(inf.en)===want){
        return String(inf.he||k||"");
      }
      if(wantHe){
        var kh=noNiq(k).replace(/[^\u05D0-\u05EA]/g,"");
        var ih=noNiq(inf.he).replace(/[^\u05D0-\u05EA]/g,"");
        if(kh===wantHe || ih===wantHe)return String(inf.he||k||"");
      }

      var groups=["present","past","future","imperative"];
      for(var g=0;g<groups.length;g++){
        var rows=rec[groups[g]];
        if(!Array.isArray(rows))continue;
        for(var r=0;r<rows.length;r++){
          if(rowMatches(rows[r]))return String(inf.he||k||"");
        }
      }
    }
  }catch(_e){}
  return "";
};

window.rootVerbExistsInDB=function(q){
  var verb=String(q||"").trim();
  if(!verb)return false;
  try{
    var w=rootVerbFrame();
    if(w&&typeof w.inputExistsInVerbBase==="function") return !!w.inputExistsInVerbBase(verb);
    var db=w&&w.verbsDB;
    if(!db)return false;
    var strip=function(v){return String(v||"").replace(/[\u0591-\u05C7]/g,"").replace(/[^\u05D0-\u05EA]/g,"").replace(/^ל/,"");};
    var want=strip(verb);
    return Object.keys(db).some(function(k){
      var rec=db[k]||{}, inf=rec.infinitive||{};
      return strip(k)===want || strip(inf.he)===want;
    });
  }catch(_e){return false;}
};
function sendRootVerbToSearch(verb){
  try{
    var w=rootVerbFrame();
    var d=frames.verbs&&frames.verbs.contentDocument;
    var inp=d&&d.getElementById("verbSearch");
    if(!inp)return false;
    inp.value=verb;
    inp.dispatchEvent(new Event("input",{bubbles:true}));
    inp.dispatchEvent(new Event("change",{bubbles:true}));
    if(w&&typeof w.patch43Search==="function") w.patch43Search();
    return true;
  }catch(_e){return false;}
}
window.openRootVerbFromDB=function(q){
  var verb=String(q||"").trim();
  if(!verb)return;
  /* Эта функция вызывается только ссылкой «Открыть спряжение».
     Никакого обращения к ИИ и никакой отправки в поле поиска здесь нет. */
  showSection("verbs");

      if(w&&typeof w.openExistingVerbFromBase==="function"){
        return !!w.openExistingVerbFromBase(verb);
      }
    }catch(_e){}
    return false;
  }
  setTimeout(openDirect,60);
  setTimeout(openDirect,180);
  setTimeout(openDirect,450);
  setTimeout(openDirect,900);
};
window.openRootVerbInAI=function(q){
  var verb=String(q||"").trim();
  if(!verb)return;
  /* Даже здесь повторно проверяем базу: существующий глагол никогда не отправляется в ИИ. */
  if(window.rootVerbExistsInDB(verb)){
    window.openRootVerbFromDB(verb);
    return;
  }
  showSection("verbs");
  setTimeout(function(){sendRootVerbToSearch(verb);},100);

};

function safeJSON(value){
  try{
    var x=JSON.parse(value||"{}");
    return x&&typeof x==="object"?x:{};
  }catch(_e){return {};}
}
function stripNiqqud(v){return String(v||"").replace(/[\u0591-\u05C7]/g,"").trim();}
function firstExampleTranslation(rec){
  if(!rec||typeof rec!=="object")return "";
  var l=rec[lang]||rec.ru||rec.uk||rec.en;
  if(l&&typeof l==="object"){
    var order=["present","past","future","imperative"];
    for(var i=0;i<order.length;i++){
      var x=l[order[i]];
      if(typeof x==="string"&&x){
        return x.replace(/<[^>]*>/g," ").replace(/\s*[—–-]\s*/g," — ").replace(/\s+/g," ").trim();
      }
    }
  }
  return "";
}

function collectDatabasePageItems(kind){
  var items=[];
  if(kind==="verbs"){
    var all=safeJSON(localStorage.getItem("hebrewVerbsLocalRecords"));
    Object.keys(all).forEach(function(base){
      var rec=all[base]||{}, d=rec.data||{}, inf=d.infinitive||{};
      items.push({
        kind:"verbs", key:base,
        he:String(inf.he||base),
        tr:String(inf[lang]||inf.ru||inf.uk||inf.en||base)
      });
    });
  }else if(kind==="roots"){
    var roots=safeJSON(localStorage.getItem("hebrewRootsDBCustomV2"));
    Object.keys(roots).forEach(function(root){
      var rec=roots[root];
      if(!rec||rec.__aiSaved!==true)return;
      var bins=Array.isArray(rec.bins)?rec.bins:[];
      var tr="";
      for(var i=0;i<bins.length;i++){
        var b=bins[i]||{};
        tr=String((lang==="uk"?b.uk:(lang==="en"?b.en:b.ru))||"").trim();
        if(tr) break;
      }
      items.push({kind:"roots",key:root,he:root,tr:tr});
    });
  }else if(kind==="preps"){
    var preps=safeJSON(localStorage.getItem("alPredlogyCustomTablesV4"));
    Object.keys(preps).forEach(function(key){
      var d=preps[key]||{}, b=d.base||{};
      items.push({
        kind:"preps",key:key,
        he:String(b.he||key),
        tr:String(b[lang]||b.ru||b.uk||b.en||key)
      });
    });
  }else if(kind==="reading"){
    var reading=safeJSON(localStorage.getItem("hebrewReadingTextsDB_V1"));
    var grouped={};
    Object.keys(reading).forEach(function(storageKey){
      var rec=reading[storageKey]||{},topic=rec.topic||{};
      var level=/^(beginner|intermediate|advanced)$/.test(String(rec.level||""))?String(rec.level):"beginner";
      var topicKey=String(rec._topicKey||storageKey).replace(/@@(?:beginner|intermediate|advanced)$/,"");
      if(!grouped[topicKey]){
        grouped[topicKey]={
          kind:"reading",key:topicKey,
          he:String(topic.he||""),
          tr:String(topic[lang]||topic.ru||topic.uk||topic.en||topicKey),
          levels:{}
        };
      }
      grouped[topicKey].levels[level]=storageKey;
      if(topic.he)grouped[topicKey].he=String(topic.he);
      if(topic[lang]||topic.ru||topic.uk||topic.en){
        grouped[topicKey].tr=String(topic[lang]||topic.ru||topic.uk||topic.en||topicKey);
      }
    });
    Object.keys(grouped).forEach(function(k){items.push(grouped[k]);});
  }else if(kind==="examples"){
    var ex=safeJSON(localStorage.getItem("hebrewVerbExamplesUserDB"));
    var localVerbs=safeJSON(localStorage.getItem("hebrewVerbsLocalRecords"));
    Object.keys(ex).forEach(function(key){
      var v=localVerbs[key]||{}, inf=v.data&&v.data.infinitive||{};
      items.push({
        kind:"examples",source:"verbs",key:key,
        he:String(inf.he||key),
        tr:String(inf[lang]||inf.ru||inf.uk||inf.en||firstExampleTranslation(ex[key])||key)
      });
    });

    /* Пользовательские примеры предлогов/слов, если они сохранены мостом раздела склонения. */
    var pex=safeJSON(localStorage.getItem("alPrepositionWordExamplesDB_V1"));
    Object.keys(pex).forEach(function(key){
      var d=pex[key]||{}, b=d.base||{};
      items.push({
        kind:"examples",source:"preps",key:key,
        he:String(b.he||key),
        tr:String(b[lang]||b.ru||b.uk||b.en||key)
      });
    });
  }

  var locale=lang==="uk"?"uk":(lang==="en"?"en":"ru");
  var coll;
  try{coll=new Intl.Collator(locale,{sensitivity:"base",numeric:true});}catch(_e){coll=null;}
  items.sort(function(a,b){
    var aa=String(a.tr||a.he||a.key||"");
    var bb=String(b.tr||b.he||b.key||"");
    return coll?coll.compare(aa,bb):aa.localeCompare(bb);
  });
  return items;
}

function readingLevelLabel(level){
  if(lang==="uk")return level==="advanced"?"Просунутий":(level==="intermediate"?"Середній":"Початковий");
  if(lang==="en")return level==="advanced"?"Advanced":(level==="intermediate"?"Intermediate":"Beginner");
  return level==="advanced"?"Продвинутый":(level==="intermediate"?"Средний":"Начальный");
}

function deleteDatabasePageItem(kind,key,source){
  if(kind==="verbs"){
    /* Сначала вызываем штатное удаление раздела: оно удаляет запись и из
       hebrewVerbsLocalRecords, и из Firebase. Только затем выполняем fallback. */
    try{
      var w=frames.verbs.contentWindow, d=frames.verbs.contentDocument;
      var inp=d&&d.getElementById("verbSearch"), rem=d&&d.getElementById("alwaysAiCodeRemove");
      if(inp&&rem){
        inp.value=key;
        inp.dispatchEvent(new Event("input",{bubbles:true}));
        rem.click();
      }
      setTimeout(function(){
        var all=safeJSON(localStorage.getItem("hebrewVerbsLocalRecords"));
        if(all[key]){
          var obj=w&&w.verbsDB&&w.verbsDB[key];
          delete all[key];
          try{localStorage.setItem("hebrewVerbsLocalRecords",JSON.stringify(all));}catch(_e){}
          if(w&&w.verbsDB&&obj){
            Object.keys(w.verbsDB).forEach(function(k){if(k===key||w.verbsDB[k]===obj)delete w.verbsDB[k];});
          }
          var card=d&&d.querySelector('.verb[data-base="'+(w&&w.CSS&&w.CSS.escape?w.CSS.escape(key):key.replace(/"/g,'\\"'))+'"]');
          if(card)card.remove();
        }
        if(databaseListKind==="verbs")renderDatabaseListPage();
      },180);
    }catch(_e){}
  }else if(kind==="roots"){
    var roots=safeJSON(localStorage.getItem("hebrewRootsDBCustomV2"));
    delete roots[key];
    try{localStorage.setItem("hebrewRootsDBCustomV2",JSON.stringify(roots));}catch(_e){}
    try{
      var rw=frames.roots.contentWindow;
      if(rw&&rw.rootsDB)delete rw.rootsDB[key];
      var rd=frames.roots.contentDocument, inp=rd&&rd.getElementById("rootInput"), rem=rd&&rd.getElementById("rootCodeRemove");
      if(inp&&rem){inp.value=key;rem.click();}
    }catch(_e){}
  }else if(kind==="preps"){
    var preps=safeJSON(localStorage.getItem("alPredlogyCustomTablesV4"));
    delete preps[key];
    try{localStorage.setItem("alPredlogyCustomTablesV4",JSON.stringify(preps));}catch(_e){}
    try{
      var d=frames.preps.contentDocument, inp=d&&d.getElementById("verbSearch"), rem=d&&d.getElementById("alwaysAiCodeRemove");
      if(inp&&rem){inp.value=key;rem.click();}
    }catch(_e){}
  }else if(kind==="reading"){
    var reading=safeJSON(localStorage.getItem("hebrewReadingTextsDB_V1"));
    Object.keys(reading).forEach(function(storageKey){
      var rec=reading[storageKey]||{};
      var topicKey=String(rec._topicKey||storageKey).replace(/@@(?:beginner|intermediate|advanced)$/,"");
      if(topicKey===key)delete reading[storageKey];
    });
    try{localStorage.setItem("hebrewReadingTextsDB_V1",JSON.stringify(reading));}catch(_e){}
    try{
      var rd=frames.reading.contentDocument,inp=rd&&rd.getElementById("topicInput");
      if(inp&&String(inp.value||"").trim()===String(key||"").trim())inp.dispatchEvent(new Event("input",{bubbles:true}));
    }catch(_e){}
  }else if(kind==="examples"){
    if(source==="preps"){
      var pex=safeJSON(localStorage.getItem("alPrepositionWordExamplesDB_V1"));
      delete pex[key];
      try{localStorage.setItem("alPrepositionWordExamplesDB_V1",JSON.stringify(pex));}catch(_e){}
    }else{
      var ex=safeJSON(localStorage.getItem("hebrewVerbExamplesUserDB"));
      delete ex[key];
      try{localStorage.setItem("hebrewVerbExamplesUserDB",JSON.stringify(ex));}catch(_e){}
      try{
        var ew=frames.examples.contentWindow;
        if(ew&&ew.examplesDB)delete ew.examplesDB[key];
      }catch(_e){}
    }
  }
  renderDatabaseListPage();
}

/* Озвучка עִבְרִית — используется лучший доступный профессиональный голос иврита устройства. */
(function(){
  var el=document.getElementById("homeHebrewSpeak");
  if(!el || !("speechSynthesis" in window)) return;

  function bestHebrewVoice(){
    var voices=window.speechSynthesis.getVoices()||[];
    var list=voices.filter(function(v){ return /^he(?:-|$)/i.test(v.lang||""); });
    function score(v){
      var n=(v.name||"").toLowerCase(), l=(v.lang||"").toLowerCase(), s=0;
      if(l==="he-il") s+=100;
      if(/natural|premium|enhanced|neural/.test(n)) s+=60;
      if(/microsoft|google|apple|siri/.test(n)) s+=25;
      if(v.localService) s+=5;
      return s;
    }
    list.sort(function(a,b){return score(b)-score(a);});
    return list[0]||null;
  }

  function speak(){
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance("עִבְרִית");
    u.lang="he-IL";
    u.rate=0.86;
    u.pitch=1;
    u.volume=1;
    var v=bestHebrewVoice();
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }

  el.addEventListener("click",speak);
  el.addEventListener("keydown",function(e){
    if(e.key==="Enter" || e.key===" "){e.preventDefault();speak();}
  });
  window.speechSynthesis.getVoices();
})();

})();
</script>

<script id="saved-latest-user-added-script">
(function(){

<script id="site-global-hebrew-audio">
(function(){
"use strict";
var activeAudio=null,lastText="",lastAt=0;
function clean(t){return String(t||"").replace(/\u00a0/g," ").replace(/\s+/g," ").trim();}
function stop(){
  try{if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio.src="";}}catch(_e){}
  activeAudio=null;
  try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(_e){}
}
function browserSpeak(text){
  try{
    if(!window.speechSynthesis||typeof window.SpeechSynthesisUtterance!=="function")return false;
    var synth=window.speechSynthesis,voices=synth.getVoices?synth.getVoices():[],voice=null;
    for(var i=0;i<voices.length;i++){
      var lang=String(voices[i].lang||""),name=String(voices[i].name||"");
      if(/^(he|iw)(-|_)?/i.test(lang)||/Hebrew|עברית/i.test(name+" "+lang)){voice=voices[i];break;}
    }
    var u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:"he-IL";if(voice)u.voice=voice;
    u.rate=.82;u.pitch=1;u.volume=1;
    synth.cancel();try{if(synth.resume)synth.resume();}catch(_e){}
    synth.speak(u);return true;
  }catch(_e){return false;}
}
function googleSpeak(text){
  var used=false;
  function fallback(){if(used)return;used=true;browserSpeak(text);}
  try{
    var a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=he&q="+encodeURIComponent(text));
    a.preload="auto";activeAudio=a;
    a.addEventListener("error",fallback,{once:true});
    a.addEventListener("abort",fallback,{once:true});
    a.addEventListener("stalled",fallback,{once:true});
    var p=a.play();if(p&&typeof p.catch==="function")p.catch(fallback);
    return true;
  }catch(_e){fallback();return false;}
}
window.siteStopHebrewAudio=stop;
window.siteSpeakHebrew=function(text){
  var t=clean(text);if(!t)return false;
  var now=Date.now();if(t===lastText&&now-lastAt<350)return false;
  lastText=t;lastAt=now;stop();googleSpeak(t);return true;
};
try{
 if(window.speechSynthesis&&window.speechSynthesis.getVoices){
   window.speechSynthesis.getVoices();
   if(window.speechSynthesis.addEventListener)window.speechSynthesis.addEventListener("voiceschanged",function(){try{window.speechSynthesis.getVoices();}catch(_e){}});
 }
}catch(_e){}
})();
</script>
