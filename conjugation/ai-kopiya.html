<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спряжение глаголов — личная база</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}.app{width:100%;max-width:430px;height:100vh;margin:0 auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}.header{flex:0 0 auto;background:#fff;border-bottom:1px solid #d0d0d0}.title-row{height:54px;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;padding:4px}.back-btn{width:44px;height:44px;border:0;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}.back-mark{width:26px;height:26px;border-left:6px solid #0b69c7;border-bottom:6px solid #0b69c7;transform:rotate(45deg);border-radius:3px;margin-left:8px}.title{font-size:clamp(21px,6vw,30px);font-weight:900;text-align:center;white-space:nowrap;letter-spacing:-1px}.help-btn{width:40px;height:40px;border:2px solid #000;border-radius:50%;background:#fff;color:#000;font-size:28px;font-weight:900;line-height:1;cursor:pointer}.lang-row{height:70px;display:flex;align-items:center;justify-content:center;gap:10px}.globe{font-size:38px}.lang-btn{border:0;background:#fff;color:#000;font-size:34px;font-weight:400;cursor:pointer;padding:0}.lang-btn.active{font-weight:900}.sep{font-size:34px}.main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 18px 26px}.search-wrap{position:relative;margin:0 0 16px}#verbInput{width:100%;height:64px;border:2px solid #000;border-radius:14px;text-align:center;font-size:28px;font-weight:900;padding:0 58px 0 18px;outline:none}#verbInput::placeholder{color:#555;opacity:1}#clearBtn{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;background:transparent;color:#666;font-size:52px;line-height:46px;cursor:pointer}.main-btn{width:100%;border:2px solid #000;border-radius:14px;background:#fff;color:#000;font-size:25px;font-weight:900;line-height:1.15;padding:18px 10px;margin:0 0 14px;cursor:pointer}.code-row{display:grid;grid-template-columns:minmax(0,1fr) 68px 68px;gap:10px;align-items:stretch;margin:0 0 8px}#codeInput{width:100%;min-height:86px;max-height:210px;border:2px solid #000;border-radius:14px;background:#fff;color:#000;font-family:Consolas,monospace;font-size:15px;font-weight:700;padding:10px;resize:vertical;outline:none}.square-btn{border:2px solid #000;border-radius:14px;background:#fff;color:#000;font-size:46px;font-weight:900;line-height:1;cursor:pointer}#status{text-align:center;font-size:21px;font-weight:900;line-height:1.2;min-height:26px;margin:8px 0 18px}.section-title{text-align:center;font-size:36px;font-weight:900;margin:22px 0 14px}.empty{border:1px solid #ddd;border-radius:14px;background:#fafafa;padding:20px 14px;text-align:center;font-size:23px;font-weight:900;line-height:1.25}.verb-card{display:flex;flex-direction:column;width:100%;margin:0 0 8px;border:1px solid #e3e3e3;border-radius:10px;overflow:hidden;text-align:center;background:#fff;cursor:pointer}.verb-card .tr{background:#d9d9d9;color:#111;font-size:22px;font-weight:900;line-height:1.15;padding:7px}.verb-card .he{background:#fff;color:#000;font-family:David,"Times New Roman",serif;font-size:40px;font-weight:900;line-height:1.05;padding:10px;direction:rtl;unicode-bidi:isolate}.conj-title{text-align:center;font-size:35px;font-weight:900;margin:22px 0 12px}.inf-card{border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;text-align:center;margin:0 0 14px}.inf-card .tr{display:block;background:#d9d9d9;font-size:22px;font-weight:900;padding:7px}.inf-card .he{display:block;background:#fff;font-family:David,"Times New Roman",serif;font-size:42px;font-weight:900;line-height:1.05;padding:12px;direction:rtl;unicode-bidi:isolate}.tense{margin:14px 0 22px}.tense-name{background:#cfcfcf;border:1px solid #d8d8d8;border-radius:8px 8px 0 0;text-align:center;font-size:25px;font-weight:900;padding:8px}.row-card{border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;text-align:center;background:#fff;margin:0 0 6px}.row-card .ru{background:#d9d9d9;color:#111;font-size:18px;font-weight:900;line-height:1.15;padding:6px}.row-card .he{font-family:David,"Times New Roman",serif;font-size:34px;font-weight:900;line-height:1.08;padding:9px;direction:rtl;unicode-bidi:isolate}.person{display:inline-block;margin-left:8px;color:#8a2e2e;font-size:.72em}.hidden{display:none!important}.help-pop{display:none;position:fixed;left:14px;right:14px;top:116px;max-width:400px;margin:0 auto;background:#fff;border:2px solid #777;border-radius:14px;box-shadow:0 12px 25px rgba(0,0,0,.22);padding:16px;z-index:50;font-size:18px;line-height:1.35;max-height:calc(100vh - 130px);overflow:auto}.help-pop.open{display:block}.help-pop button{float:right;border:1px solid #aaa;background:#f7f7f7;border-radius:8px;font-size:22px;line-height:1;padding:4px 10px}
</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
</head>
<body>
<div class="app"><header class="header"><div class="title-row"><button class="back-btn" id="backBtn" type="button"><span class="back-mark"></span></button><div class="title">Спряжение глаголов</div><button class="help-btn" id="helpBtn" type="button">?</button></div><div class="lang-row"><span class="globe">🌐</span><button class="lang-btn active" data-lang="ru" type="button">RU</button><span class="sep">|</span><button class="lang-btn" data-lang="uk" type="button">UK</button><span class="sep">|</span><button class="lang-btn" data-lang="en" type="button">EN</button></div></header><main class="main" id="mainPanel"><div class="search-wrap"><input id="verbInput" type="text" placeholder="🔍 Введите глагол" autocomplete="off"><button id="clearBtn" type="button">×</button></div><button class="main-btn" id="aiBtn" type="button">Получить готовое спряжение в ИИ</button><div class="code-row"><textarea id="codeInput" placeholder="Вставьте код verbsDB из ИИ"></textarea><button class="square-btn" id="addBtn" type="button">+</button><button class="square-btn" id="removeBtn" type="button">−</button></div><div id="status"></div><section id="listScreen"><div class="section-title">Инфинитивы</div><div id="verbList"></div></section><section id="tableScreen" class="hidden"></section></main></div>
<div class="help-pop" id="helpPop"><button type="button" id="closeHelp">×</button><b>Как работает сайт</b><p>1. Введите глагол.</p><p>2. Нажмите «Получить готовое спряжение в ИИ».</p><p>3. Вставьте запрос в ChatGPT.</p><p>4. Скопируйте ответ ИИ.</p><p>5. Вставьте код в поле и нажмите +.</p><p>6. Таблица сохранится в Firebase и появится в списке инфинитивов.</p></div>
<script>
(function(){
var FIREBASE_PATH="hebrewVerbs/userVerbsV2",db=null,records={},lastAddedBase="";
function $(id){return document.getElementById(id)}
function getLang(){var a=document.querySelector(".lang-btn.active");return a?a.getAttribute("data-lang")||"ru":"ru"}
function tr(o){if(!o)return"";if(typeof o==="string")return o;var l=getLang();return o[l]||o.ru||o.uk||o.en||o.he||""}
function stripNiqqud(s){return String(s||"").normalize("NFD").replace(/[\u0591-\u05C7]/g,"").replace(/[\u200e\u200f]/g,"").trim()}
function norm(s){return stripNiqqud(s).toLowerCase().trim().replace(/^ל/,"")}
function safeKey(s){return encodeURIComponent(String(s||"").trim())}
function getDb(){if(db)return db;try{if(!window.firebaseConfig||!window.firebaseConfig.apiKey)return null;if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);db=firebase.database();return db}catch(e){console.error(e);return null}}
function isVerbObject(v){return v&&typeof v==="object"&&v.infinitive&&Array.isArray(v.present)&&Array.isArray(v.past)&&Array.isArray(v.future)&&Array.isArray(v.imperative)}
function inf(v,base){var i=v&&v.infinitive?v.infinitive:{};return{he:i.he||base||"",ru:i.ru||base||"",uk:i.uk||i.ru||base||"",en:i.en||i.ru||base||""}}
function setStatus(m){$("status").textContent=m||""}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function extractCode(raw){raw=String(raw||"").replace(/```(?:javascript|js|html)?/gi,"").replace(/```/g,"");var start=raw.indexOf("verbsDB[");if(start<0)return"";var code=raw.slice(start),aliasRe=/verbsDB\s*\[[^\]]+\]\s*=\s*verbsDB\s*\[[^\]]+\]\s*;/g,m,last=-1;while((m=aliasRe.exec(code))!==null)last=m.index+m[0].length;if(last>0)return code.slice(0,last).trim();var depth=0,started=false,end=-1;for(var i=0;i<code.length;i++){var ch=code[i];if(ch==="{"){depth++;started=true}if(ch==="}"){depth--;if(started&&depth===0){end=i+1;break}}}if(end>0){var semi=code.indexOf(";",end);return code.slice(0,semi>0?semi+1:end).trim()}return code.trim()}
function parseVerb(raw){var code=extractCode(raw);if(!code)return null;var temp={};new Function("verbsDB",code)(temp);var base=Object.keys(temp).find(function(k){return isVerbObject(temp[k])});if(!base)return null;var data=temp[base],aliases=Object.keys(temp).filter(function(k){return k!==base&&temp[k]===data});return{base:base,data:data,aliases:aliases}}
function saveLocal(r){records[r.base]=r;(r.aliases||[]).forEach(function(a){records[a]={base:a,data:r.data,aliases:[],mainBase:r.base}})}
function loadAll(){var d=getDb();if(!d){setStatus("Firebase не настроен.");renderList();return}d.ref(FIREBASE_PATH).once("value").then(function(snap){records={};snap.forEach(function(child){var v=child.val();if(v&&v.base&&isVerbObject(v.data))saveLocal({base:v.base,data:v.data,aliases:v.aliases||[]})});setStatus("");renderList()}).catch(function(e){console.error(e);setStatus("Ошибка чтения Firebase.");renderList()})}
function renderList(filter){$("listScreen").classList.remove("hidden");$("tableScreen").classList.add("hidden");$("tableScreen").innerHTML="";var q=norm(filter||""),keys=Object.keys(records).filter(function(base){var r=records[base];if(r.mainBase)return false;var i=inf(r.data,base);if(!q)return true;return norm(base).indexOf(q)>=0||norm(i.he).indexOf(q)>=0||norm(i.ru).indexOf(q)>=0||norm(i.uk).indexOf(q)>=0||norm(i.en).indexOf(q)>=0}).sort(function(a,b){return tr(inf(records[a].data,a)).localeCompare(tr(inf(records[b].data,b)))});var box=$("verbList");box.innerHTML="";if(!keys.length){box.innerHTML='<div class="empty">Пока нет созданных таблиц.<br>Введите глагол и создайте первую таблицу через ИИ.</div>';return}keys.forEach(function(base){var r=records[base],i=inf(r.data,base),card=document.createElement("div");card.className="verb-card";card.innerHTML='<span class="tr"></span><span class="he"></span>';card.querySelector(".tr").textContent=tr(i);card.querySelector(".he").textContent=i.he||base;card.onclick=function(){openVerb(base)};box.appendChild(card)})}
function rowTr(row){if(!row)return"";if(row.ru||row.uk||row.en)return tr(row);return row.tr||""}
function rowHe(row){return row.he||row.hebrew||""}
function rowPerson(row){if(!row)return"";if(row.person&&typeof row.person==="object")return row.person.he||tr(row.person);return row.person||""}
function section(title,rows){var h='<div class="tense"><div class="tense-name">'+esc(title)+'</div>';(rows||[]).forEach(function(row){h+='<div class="row-card"><div class="ru">'+esc(rowTr(row))+'</div><div class="he"><span>'+esc(rowHe(row))+'</span>';var p=rowPerson(row);if(p)h+='<span class="person">'+esc(p)+'</span>';h+='</div></div>'});return h+'</div>'}
function openVerb(base){var r=records[base];if(!r||!r.data)return;var v=r.data,i=inf(v,base);$("listScreen").classList.add("hidden");$("tableScreen").classList.remove("hidden");$("tableScreen").innerHTML='<div class="conj-title">'+esc(tr(i))+'</div><div class="inf-card"><span class="tr">'+esc(tr(i))+'</span><span class="he">'+esc(i.he||base)+'</span></div>'+section("Настоящее время",v.present)+section("Прошедшее время",v.past)+section("Будущее время",v.future)+section("Повелительное наклонение",v.imperative);$("mainPanel").scrollTop=0}
function findExact(raw){var q=norm(raw);if(!q)return"";return Object.keys(records).find(function(base){var i=inf(records[base].data,base);return norm(base)===q||norm(i.he)===q||norm(i.ru)===q||norm(i.uk)===q||norm(i.en)===q})||""}
function onInput(){var raw=$("verbInput").value;$("clearBtn").style.display=raw.trim()?"block":"none";var exact=findExact(raw);if(exact){setStatus("");openVerb(exact);return}renderList(raw);if(raw.trim())setStatus("Глагола нет в вашей базе. Создайте его через ИИ.");else setStatus("")}
function buildPrompt(){var verb=$("verbInput").value.trim();if(!verb){alert("Введите глагол.");return""}return ["Привет, Володя! Сделай полное спряжение глагола иврита: "+verb+".","Все названия разделов и переводы должны быть на русском языке.","Иврит обязательно с огласовками.","","Верни ТОЛЬКО готовый JavaScript-блок для вставки в базу verbsDB.","Не делай Markdown-таблицу.","Не добавляй объяснения до и после кода.","","Нужны все формы:","- infinitive: {he, ru, uk, en};","- present — 11 форм;","- past — 9 форм;","- future — 9 форм;","- imperative — 4 формы.","","Формат строго такой:",'verbsDB["BASE"] = {','  infinitive:{he:"...", ru:"...", uk:"...", en:"..."},','  present:[{person:{he:"אני (ז)"}, he:"...", tr:"...", ru:"...", uk:"...", en:"..."}],','  past:[{person:{he:"אני"}, he:"...", tr:"...", ru:"...", uk:"...", en:"..."}],','  future:[{person:{he:"אני"}, he:"...", tr:"...", ru:"...", uk:"...", en:"..."}],','  imperative:[{person:{he:"אתה"}, he:"...", tr:"...", ru:"...", uk:"...", en:"..."}]','};',"","Важно:","- BASE должен быть основой без начальной ל;","- не пропускай лица;","- в поле he пиши только форму глагола на иврите;","- в person.he пиши местоимение на иврите;","- переводы каждой формы нужны на русском, украинском и английском."].join("\n")}
async function openAI(){var p=buildPrompt();if(!p)return;try{await navigator.clipboard.writeText(p);alert("Запрос скопирован. Сейчас откроется ИИ — вставьте запрос в поле сообщения.")}catch(e){window.prompt("Скопируйте запрос вручную:",p)}window.open("https://chat.openai.com/","_blank","noopener")}
function addVerb(){var d=getDb();if(!d){setStatus("Firebase не настроен.");return}try{var r=parseVerb($("codeInput").value);if(!r){setStatus("Не найден правильный блок verbsDB.");return}setStatus("Сохраняю в Firebase...");d.ref(FIREBASE_PATH+"/"+safeKey(r.base)).set({base:r.base,data:r.data,aliases:r.aliases||[],createdAt:Date.now()}).then(function(){saveLocal(r);lastAddedBase=r.base;var i=inf(r.data,r.base);$("verbInput").value=tr(i);$("clearBtn").style.display="block";$("codeInput").value="";renderList();openVerb(r.base);setStatus("Глагол сохранён в Firebase и открыт.")}).catch(function(e){console.error(e);setStatus("Ошибка сохранения Firebase.")})}catch(e){console.error(e);setStatus("Ошибка кода verbsDB.")}}
function removeLast(){var d=getDb();if(!d){setStatus("Firebase не настроен.");return}if(!lastAddedBase){setStatus("Пока нечего удалять.");return}var b=lastAddedBase;d.ref(FIREBASE_PATH+"/"+safeKey(b)).remove().then(function(){delete records[b];lastAddedBase="";setStatus("Последний добавленный глагол удалён.");renderList()})}
document.addEventListener("DOMContentLoaded",function(){$("aiBtn").onclick=openAI;$("addBtn").onclick=addVerb;$("removeBtn").onclick=removeLast;$("backBtn").onclick=function(){setStatus("");renderList()};$("clearBtn").onclick=function(){$("verbInput").value="";$("clearBtn").style.display="none";setStatus("");renderList()};$("verbInput").addEventListener("input",onInput);$("helpBtn").onclick=function(){$("helpPop").classList.add("open")};$("closeHelp").onclick=function(){$("helpPop").classList.remove("open")};document.querySelectorAll(".lang-btn").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll(".lang-btn").forEach(function(b){b.classList.remove("active")});btn.classList.add("active");renderList($("verbInput").value)})});loadAll()});
})();
</script>
</body>
</html>
