<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Личная база спряжений иврита</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}.mobile-app{width:100%;max-width:430px;margin:0 auto;background:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}.mobile-header{flex:0 0 auto;background:#fff;border-bottom:1px solid #cfcfcf}.title-row{height:50px;display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;padding:2px 5px 1px 2px;gap:2px}.back-btn{border:0;background:transparent;padding:0;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer}.back-mark{width:22px;height:22px;border-left:5px solid #0b69c7;border-bottom:5px solid #0b69c7;transform:rotate(45deg);border-radius:3px;margin-left:8px}.app-title{font-size:clamp(17px,4.8vw,23px);line-height:1;font-weight:900;text-align:center;white-space:nowrap;letter-spacing:-1px}.help-btn{width:32px;height:32px;border-radius:50%;border:2px solid #000;background:#fff;color:#000;font-size:22px;font-weight:900;line-height:1;cursor:pointer}.toolbar{height:48px;display:flex;align-items:center;justify-content:center;padding:0 8px 4px;background:#fff}.langs{display:flex;align-items:center;gap:8px;font-size:22px;white-space:nowrap}.globe{font-size:27px;color:#1e9bf0;line-height:1}.lang-btn{border:0;background:transparent;font-size:22px;padding:2px 0;cursor:pointer;color:#000}.lang-btn.active{font-weight:900}.sep{font-weight:400;color:#000}#mainPanel{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 7px 20px;background:#fff}.search-box{width:min(100%,390px);margin:0 auto 10px;position:relative}#verbInput{width:100%;height:44px;border:2px solid #000;border-radius:10px;background:#fff;color:#000;font-size:20px;font-weight:900;padding:0 48px 0 14px;outline:none;text-align:center}#verbInput::placeholder{color:#555;font-weight:900;opacity:1}#clearBtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:#666;font-size:34px;line-height:34px;cursor:pointer;display:none}.main-btn{display:block;width:min(100%,390px);margin:8px auto;border:2px solid #000;border-radius:10px;background:#fff;color:#000;text-decoration:none;font-size:18px;font-weight:900;line-height:1.2;padding:12px 10px;cursor:pointer}.paste-row{display:grid;width:min(100%,390px);margin:8px auto 12px;grid-template-columns:minmax(0,1fr) 46px 46px;gap:6px;align-items:stretch}#codeInput{width:100%;min-height:58px;max-height:180px;border:2px solid #000;border-radius:10px;background:#fff;color:#000;font-family:Consolas,monospace;font-size:13px;font-weight:700;line-height:1.25;padding:8px;resize:vertical;outline:none}.square-btn{width:46px;min-width:46px;border:2px solid #000;border-radius:10px;background:#fff;color:#000;font-size:32px;font-weight:900;line-height:1;cursor:pointer}#status{grid-column:1 / span 3;min-height:18px;text-align:center;font-size:14px;font-weight:900;color:#111}.section-title{margin:14px auto 8px;width:min(100%,390px);text-align:center;font-size:25px;font-weight:900;line-height:1.1}.verb-list{width:min(100%,390px);margin:0 auto 18px}.verb-card{display:flex;flex-direction:column;width:100%;margin:0 0 6px;padding:0;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;cursor:pointer;text-align:center;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.05)}.verb-card .tr{display:block;background:#d9d9d9;color:#111;font-size:16px;font-weight:900;line-height:1.15;padding:4px 6px}.verb-card .he{display:block;background:#fff;font-family:David,'Times New Roman',serif;font-size:34px;font-weight:900;line-height:1.05;padding:8px 6px 9px;direction:rtl;unicode-bidi:isolate;color:#000}.empty-list{width:min(100%,390px);margin:12px auto;border:1px solid #ddd;border-radius:10px;background:#fafafa;padding:14px;text-align:center;font-size:16px;font-weight:800;line-height:1.25}.conj-title{margin:18px 0 10px;text-align:center;font-size:28px;font-weight:900;line-height:1.1}.conj-inf-card{width:min(100%,390px);margin:0 auto 10px;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;text-align:center;background:#fff}.conj-inf-card .tr{display:block;background:#d9d9d9;color:#111;font-size:16px;font-weight:900;line-height:1.15;padding:4px 6px}.conj-inf-card .he{display:block;font-family:David,'Times New Roman',serif;font-size:34px;font-weight:900;line-height:1.05;padding:8px 6px 9px;direction:rtl;unicode-bidi:isolate;color:#000}.tense-block{width:min(100%,390px);margin:10px auto 16px}.tense-name{background:#cfcfcf;border:1px solid #d8d8d8;border-radius:5px 5px 0 0;text-align:center;font-size:20px;font-weight:900;line-height:1.15;padding:5px 4px;color:#000}.conj-row-card{width:100%;margin:0 0 5px;border:1px solid #e5e5e5;border-radius:4px;overflow:hidden;text-align:center;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.05)}.conj-row-card .form-translation{display:block;background:#d9d9d9;color:#111;font-size:15px;font-weight:900;line-height:1.15;padding:3px 6px;white-space:normal;margin:0}.conj-row-card .form-hebrew{display:block;background:#fff;font-family:David,'Times New Roman',serif;font-size:31px;font-weight:900;line-height:1.08;padding:6px 6px 8px;direction:rtl;unicode-bidi:isolate;color:#000}.conj-person{display:inline-block;margin-left:8px;color:#8a2e2e;font-size:.72em;vertical-align:baseline}.conj-form{display:inline-block;color:#000}.help-pop{display:none;position:fixed;left:12px;right:12px;top:104px;max-width:390px;margin:0 auto;background:#fff;border:2px solid #8b8b8b;border-radius:14px;box-shadow:0 12px 25px rgba(0,0,0,.22);padding:14px;z-index:50;font-size:15px;line-height:1.32;max-height:calc(100vh - 116px);overflow:auto}.help-pop.open{display:block}.help-pop button{float:right;border:1px solid #aaa;background:#f7f7f7;border-radius:8px;font-size:17px;line-height:1;padding:4px 10px}.hidden{display:none!important}
</style>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
</head>
<body>
<div class="mobile-app"><header class="mobile-header"><div class="title-row"><button class="back-btn" id="backBtn" type="button" aria-label="Инфинитивы"><span class="back-mark"></span></button><div class="app-title">Спряжение глаголов</div><button class="help-btn" id="helpBtn" type="button">?</button></div><div class="toolbar"><div class="langs"><span class="globe">🌐</span><button class="lang-btn active" type="button" data-lang="ru">RU</button><span class="sep">|</span><button class="lang-btn" type="button" data-lang="uk">UK</button><span class="sep">|</span><button class="lang-btn" type="button" data-lang="en">EN</button></div></div></header>
<main id="mainPanel"><div class="search-box"><input id="verbInput" type="text" placeholder="🔍 Введите глагол" autocomplete="off"><button id="clearBtn" type="button">×</button></div><button type="button" class="main-btn" id="aiBtn">Получить готовое спряжение в ИИ</button><div class="paste-row"><textarea id="codeInput" placeholder="Вставьте ответ ИИ или код verbsDB"></textarea><button type="button" class="square-btn" id="addBtn">+</button><button type="button" class="square-btn" id="removeBtn">−</button><div id="status"></div></div><section id="listScreen"><div class="section-title">Инфинитивы</div><div class="verb-list" id="verbList"></div></section><section id="tableScreen" class="hidden"></section></main></div>
<div class="help-pop" id="helpPop"><button type="button" id="closeHelp">×</button><b>Как работает сайт</b><p>1. Введите глагол.</p><p>2. Нажмите «Получить готовое спряжение в ИИ».</p><p>3. Скопируйте ответ ИИ.</p><p>4. Вставьте ответ в поле и нажмите +.</p><p>5. Таблица сохранится в вашей базе Firebase и появится в списке инфинитивов.</p></div>
<script>
(function(){var FIREBASE_PATH="hebrewVerbs/userVerbs";var records={};var lastAddedBase="";var db=null;var $=function(id){return document.getElementById(id)};function lang(){var a=document.querySelector(".lang-btn.active");return a?a.getAttribute("data-lang")||"ru":"ru"}function text(o){if(!o)return"";if(typeof o==="string")return o;return o[lang()]||o.ru||o.uk||o.en||o.he||""}function stripNiqqud(s){return String(s||"").normalize("NFD").replace(/[\u0591-\u05C7]/g,"").replace(/\u200f|\u200e/g,"").trim()}function norm(s){s=stripNiqqud(s).toLowerCase().trim();return s.replace(/^ל/,"")}function safeKey(b){return encodeURIComponent(String(b||"").trim())}function getDb(){if(db)return db;try{if(!window.firebaseConfig||!window.firebaseConfig.apiKey)return null;if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);db=firebase.database();return db}catch(e){console.error(e);return null}}function isVerbObject(v){return v&&typeof v==="object"&&Array.isArray(v.present)&&Array.isArray(v.past)&&Array.isArray(v.future)&&Array.isArray(v.imperative)}function getInf(v,base){var inf=v&&v.infinitive?v.infinitive:{};return{he:inf.he||v.infinitiveHe||base||"",ru:inf.ru||v.ru||v.translation||base||"",uk:inf.uk||inf.ru||v.uk||v.translation||base||"",en:inf.en||inf.ru||v.en||v.translation||base||""}}function extractCode(raw){raw=String(raw||"").replace(/```(?:javascript|js|html)?/gi,"").replace(/```/g,"");var start=raw.indexOf("verbsDB[");if(start<0)return"";var code=raw.slice(start);var aliasRe=/verbsDB\s*\[[^\]]+\]\s*=\s*verbsDB\s*\[[^\]]+\]\s*;/g;var m,lastEnd=-1;while((m=aliasRe.exec(code))!==null)lastEnd=m.index+m[0].length;if(lastEnd>0)return code.slice(0,lastEnd).trim();var depth=0,started=false,end=-1;for(var i=0;i<code.length;i++){var ch=code[i];if(ch==="{"){depth++;started=true}if(ch==="}"){depth--;if(started&&depth===0){end=i+1;break}}}if(end>0){var semi=code.indexOf(";",end);return code.slice(0,semi>0?semi+1:end).trim()}return code.trim()}function parseVerbCode(raw){var code=extractCode(raw);if(!code)return null;var temp={};new Function("verbsDB",code)(temp);var base=Object.keys(temp).find(function(k){return isVerbObject(temp[k])});if(!base)return null;var obj=temp[base];var aliases=Object.keys(temp).filter(function(k){return k!==base&&temp[k]===obj});return{base:base,data:obj,aliases:aliases}}function recordToFirebase(r){return{base:r.base,data:r.data,aliases:r.aliases||[],createdAt:Date.now()}}function saveRecord(r){records[r.base]=r;(r.aliases||[]).forEach(function(a){records[a]={base:a,data:r.data,aliases:[],mainBase:r.base}})}function setStatus(m){$("status").textContent=m||""}function loadFirebase(){var d=getDb();if(!d){setStatus("Firebase не настроен.");renderList();return}d.ref(FIREBASE_PATH).once("value").then(function(s){records={};s.forEach(function(c){var v=c.val();if(v&&v.base&&v.data&&isVerbObject(v.data))saveRecord({base:v.base,data:v.data,aliases:v.aliases||[]})});setStatus("");renderList()}).catch(function(e){console.error(e);setStatus("Ошибка чтения Firebase.");renderList()})}function renderList(filter){$("listScreen").classList.remove("hidden");$("tableScreen").classList.add("hidden");$("tableScreen").innerHTML="";var list=$("verbList");list.innerHTML="";var q=norm(filter||"");var bases=Object.keys(records).filter(function(base){var r=records[base];if(r.mainBase)return false;var inf=getInf(r.data,base);if(!q)return true;return norm(base).indexOf(q)>=0||norm(inf.he).indexOf(q)>=0||norm(inf.ru).indexOf(q)>=0||norm(inf.uk).indexOf(q)>=0||norm(inf.en).indexOf(q)>=0}).sort(function(a,b){return text(getInf(records[a].data,a)).localeCompare(text(getInf(records[b].data,b)))});if(!bases.length){list.innerHTML='<div class="empty-list">Пока нет созданных таблиц.<br>Введите глагол и создайте первую таблицу через ИИ.</div>';return}bases.forEach(function(base){var r=records[base],inf=getInf(r.data,base);var card=document.createElement("div");card.className="verb-card";card.innerHTML='<span class="tr"></span><span class="he"></span>';card.querySelector(".tr").textContent=text(inf);card.querySelector(".he").textContent=inf.he||base;card.onclick=function(){openVerb(base)};list.appendChild(card)})}function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}function rowTranslation(r){if(!r)return"";if(r.form&&typeof r.form==="object")return text(r.form);if(r.ru||r.uk||r.en)return text(r);if(r.tr)return r.tr;return""}function rowHebrew(r){return r.he||r.hebrew||r[1]||""}function rowPerson(r){if(!r)return"";if(r.person&&typeof r.person==="object")return r.person.he||text(r.person);if(r.person)return r.person;return""}function renderSection(title,rows){var html='<div class="tense-block"><div class="tense-name">'+title+'</div>';(rows||[]).forEach(function(r){html+='<div class="conj-row-card"><div class="form-translation">'+escapeHtml(rowTranslation(r))+'</div><div class="form-hebrew"><span class="conj-form">'+escapeHtml(rowHebrew(r))+'</span>';var p=rowPerson(r);if(p)html+='<span class="conj-person">'+escapeHtml(p)+'</span>';html+='</div></div>'});return html+'</div>'}function openVerb(base){var r=records[base];if(!r||!r.data)return;var v=r.data,inf=getInf(v,base);$("listScreen").classList.add("hidden");$("tableScreen").classList.remove("hidden");var html='<div class="conj-title">'+escapeHtml(text(inf))+'</div><div class="conj-inf-card"><span class="tr">'+escapeHtml(text(inf))+'</span><span class="he">'+escapeHtml(inf.he||base)+'</span></div>';html+=renderSection("Настоящее время",v.present)+renderSection("Прошедшее время",v.past)+renderSection("Будущее время",v.future)+renderSection("Повелительное наклонение",v.imperative);$("tableScreen").innerHTML=html;$("mainPanel").scrollTop=0}function findBaseByInput(raw){var q=norm(raw);if(!q)return"";return Object.keys(records).find(function(base){var inf=getInf(records[base].data,base);return norm(base)===q||norm(inf.he)===q||norm(inf.ru)===q||norm(inf.uk)===q||norm(inf.en)===q})||""}function buildPrompt(){var verb=$("verbInput").value.trim();if(!verb){alert("Введите глагол.");return""}var first="Привет, Володя! Сделай полное спряжение глагола иврита: "+verb+".";if(lang()==="uk")first="Привіт, Володю! Зроби повне відмінювання дієслова івриту: "+verb+".";if(lang()==="en")first="Hi, Volodya! Make a complete Hebrew verb conjugation table for: "+verb+".";return[first,"","Верни ТОЛЬКО готовый JavaScript-блок для базы verbsDB.","Не пиши Markdown-таблицу.","Не добавляй объяснения до и после кода.","Иврит обязательно с огласовками.","","Нужны все формы:","- infinitive: {he, ru, uk, en};","- present — 11 форм;","- past — 9 форм;","- future — 9 форм;","- imperative — 4 формы.","","Формат строго такой:",'verbsDB["BASE"] = {','  infinitive:{he:"...", ru:"...", uk:"...", en:"..."},','  present:[{person:{he:"אני (ז)"}, he:"...", tr:"...", ru:"...", uk:"...", en:"..."}],','  past:[...],','  future:[...],','  imperative:[...]','};',"","Важно:","- BASE должен быть корнем/основой без начальной ל;","- не пропускай лица;","- в поле he пиши только форму глагола на иврите;","- в person.he пиши местоимение на иврите;","- переводы каждой формы нужны на русском, украинском и английском."].join("\n")}async function openAI(){var prompt=buildPrompt();if(!prompt)return;try{await navigator.clipboard.writeText(prompt);alert("Запрос скопирован. Сейчас откроется ИИ — вставьте запрос в поле сообщения.")}catch(e){window.prompt("Скопируйте запрос вручную:",prompt)}window.open("https://chat.openai.com/","_blank","noopener")}function addVerb(){var d=getDb();if(!d){setStatus("Firebase не настроен.");return}try{var record=parseVerbCode($("codeInput").value);if(!record){setStatus("Не найден правильный блок verbsDB.");return}setStatus("Сохраняю в Firebase...");d.ref(FIREBASE_PATH+"/"+safeKey(record.base)).set(recordToFirebase(record)).then(function(){saveRecord(record);lastAddedBase=record.base;$("codeInput").value="";var inf=getInf(record.data,record.base);$("verbInput").value=text(inf);$("clearBtn").style.display="block";renderList();openVerb(record.base);setStatus("Глагол сохранён в Firebase и открыт.")}).catch(function(e){console.error(e);setStatus("Ошибка сохранения Firebase.")})}catch(e){console.error(e);setStatus("Ошибка кода verbsDB.")}}function removeLast(){var d=getDb();if(!d){setStatus("Firebase не настроен.");return}if(!lastAddedBase){setStatus("Пока нечего удалять.");return}var base=lastAddedBase;d.ref(FIREBASE_PATH+"/"+safeKey(base)).remove().then(function(){delete records[base];lastAddedBase="";setStatus("Последний добавленный глагол удалён.");renderList()})}function onInput(){var raw=$("verbInput").value;$("clearBtn").style.display=raw.trim()?"block":"none";var found=findBaseByInput(raw);if(found){openVerb(found);setStatus("")}else{renderList(raw);if(raw.trim())setStatus("Глагола нет в вашей базе. Создайте его через ИИ.");else setStatus("")}}function clearAll(){$("verbInput").value="";$("clearBtn").style.display="none";setStatus("");renderList()}document.addEventListener("DOMContentLoaded",function(){$("aiBtn").onclick=openAI;$("addBtn").onclick=addVerb;$("removeBtn").onclick=removeLast;$("backBtn").onclick=function(){renderList()};$("clearBtn").onclick=clearAll;$("verbInput").addEventListener("input",onInput);$("helpBtn").onclick=function(){$("helpPop").classList.add("open")};$("closeHelp").onclick=function(){$("helpPop").classList.remove("open")};document.querySelectorAll(".lang-btn").forEach(function(btn){btn.addEventListener("click",function(){document.querySelectorAll(".lang-btn").forEach(function(b){b.classList.remove("active")});btn.classList.add("active");renderList($("verbInput").value)})});loadFirebase()})})();
</script></body></html>
