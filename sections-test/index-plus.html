    html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    button,input,select{font:inherit}
    .app{width:min(100%,540px);margin:0 auto;min-height:100vh;padding-bottom:28px}
    .header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ccc;padding:8px 10px}

    .header-title{display:flex;align-items:center;padding:12px 16px;color:var(--blue);font-size:clamp(21px,5.7vw,30px);font-weight:800;line-height:1.05}

    .header-home{color:var(--blue);font-size:46px;font-weight:900;line-height:1;text-decoration:none}
    main{padding:18px 14px}
    h1{margin:0 0 6px;text-align:center;font-size:25px}
    .lead{margin:0 auto 18px;max-width:440px;text-align:center;color:var(--muted);font-size:16px;line-height:1.35}
    .form{display:grid;gap:13px}
    label{display:grid;gap:6px;font-weight:700;font-size:16px}

    select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,104,201,.13)}
    .difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .level{height:46px;border:1.5px solid var(--gold);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
    .level.active{background:var(--pale)}

    .square{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border:2px solid #111;border-radius:14px;background:#fff;color:#111;text-decoration:none;font-size:31px;cursor:pointer}
    .square.ai{font-size:27px;text-decoration:underline;text-underline-offset:4px}
    .instructions{margin:10px auto 6px;text-align:center;color:#333;font-size:15px;line-height:1.45}
    .status{min-height:20px;margin:8px 0;text-align:center;font-weight:700;color:var(--blue)}
    .exercise{display:none;margin-top:18px}

    .exercise-head{margin-bottom:12px;text-align:center}

    .exercise-meta{color:var(--muted);font-size:14px}
    .task{margin:0 0 12px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
    .number{padding:6px 10px;text-align:center;color:#666;font-size:13px}
    .translation{padding:11px 12px;background:#dedede;text-align:left;font-size:17px;font-weight:700;line-height:1.3}
    .choices{display:grid;gap:7px;padding:10px}
    .choice-row{display:flex;align-items:stretch;gap:6px}
    .choice{display:flex;flex:1;grid-template-columns:auto 1fr;align-items:center;gap:9px;padding:10px;border:2px solid var(--line);border-radius:10px;direction:rtl;font-family:var(--site-hebrew-font);font-size:var(--site-hebrew-size);font-weight:900;line-height:1.08;cursor:pointer}
    [lang="he"]{font-family:var(--site-hebrew-font)!important;font-size:var(--site-hebrew-size)!important;font-weight:900!important;line-height:1.08!important}
    .choice input{width:21px;height:21px;margin:0;accent-color:var(--blue);flex:0 0 auto}
    .choice-text{flex:1;cursor:pointer}
    .choice-speak{flex:0 0 46px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:3px 5px;font-size:23px;line-height:1;cursor:pointer}
    .choice.correct{border-color:var(--ok);background:#effff4}
    .choice.wrong{border-color:var(--bad);background:#fff1f0}
    .check{display:block;width:min(100%,300px);min-height:52px;margin:17px auto 7px;border:2px solid var(--blue);border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
    .local-result{display:none;margin:12px auto;padding:12px;border-radius:12px;background:#f3f7fb;text-align:center;font-weight:700;line-height:1.4}
    .local-result.open{display:block}
    .ai-check{display:none;width:min(100%,300px);min-height:50px;margin:10px auto;border:2px solid #111;border-radius:12px;background:#fff;font-weight:800;cursor:pointer}
    .ai-check.open{display:block}
    .ai-conclusion{display:none;margin:16px 0 8px;padding:14px;border:2px solid var(--blue);border-radius:14px;background:#f4f9ff}
    .ai-conclusion.open{display:block}
    .ai-conclusion h3{margin:0 0 10px;text-align:center;color:var(--blue);font-size:21px}
    .conclusion-input{display:block;width:100%;min-height:150px;border:2px solid #111;border-radius:10px;background:#fff;padding:12px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;line-height:1.25;color:#111;white-space:pre-wrap;overflow-wrap:anywhere}
    .conclusion-input:empty::before{content:attr(data-placeholder);color:#777}
    .conclusion-input .hebrew-conclusion{font-family:var(--site-hebrew-font)!important;font-size:var(--site-hebrew-size)!important;font-weight:900!important;line-height:1.08!important;direction:rtl;unicode-bidi:isolate;cursor:pointer}
    .conclusion-input .hebrew-conclusion.unpointed{font-family:David,"Times New Roman",serif!important;font-size:23px!important;font-weight:700!important;line-height:1.18!important}
    .conclusion-input .conclusion-translation{display:block;margin:-12px -12px 12px;padding:11px 12px;background:#dedede;text-align:left;font-weight:700}
    .conclusion-input .conclusion-label{display:block;margin-top:10px;font-weight:800}
    .conclusion-input .conclusion-form{display:block;margin-top:7px;font-weight:700}
    .conclusion-input .conclusion-correct-form{display:block;margin-top:7px;font-weight:800}
    .conclusion-input .analysis-translation{display:block;margin:8px 0 0;padding:7px 9px;background:#d9d9d9;text-align:left;font-weight:700}
    .conclusion-input .analysis-hebrew{display:block;padding:5px 9px 8px;text-align:right;direction:rtl}
    .overlay{position:fixed;inset:0;z-index:20;display:none;background:transparent}
    .overlay.open{display:flex!important;align-items:flex-start;justify-content:center;padding:20px 12px}
    .drawer{position:relative!important;display:block!important;visibility:visible!important;opacity:1!important;width:min(94vw,430px);height:auto;max-height:calc(100vh - 40px);overflow:auto;padding:18px;background:#fff!important;color:#111!important;border:3px solid var(--gold);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .drawer-head h2{margin:0;font-size:22px}.close-menu{border:0;background:none;font-size:34px;cursor:pointer}
    .topics{display:grid;gap:7px}.topic{min-height:45px;padding:0 14px;border:1px solid #bbb;border-radius:9px;background:#fff;text-align:left;font-size:17px;cursor:pointer}.topic.active{border:2px solid var(--blue);background:#eef7ff;color:var(--blue);font-weight:800}
    .small{margin:9px auto 0;text-align:center;color:#666;font-size:13px;line-height:1.35}
    @media(max-width:380px){main{padding-left:9px;padding-right:9px}.sentence{font-size:22px}.difficulty{gap:4px}.level{font-size:14px}}
    /* Переключатель языка перевода в жёлтой шапке */
    .header-box{grid-template-columns:minmax(0,1fr) auto 54px 58px}
    .header-title{min-width:0;padding:10px 8px 10px 12px;font-size:clamp(17px,4.5vw,27px)}

    #addExercise.numeral-waiting{cursor:wait}

    @keyframes plus-spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){#addExercise .plus-spinner{animation:plus-spin 1.5s linear infinite}}
  </style>
</head>

<div class="app">
  <header class="header">

      <div class="header-title" id="headerTitle">Упражнения по морфологии</div>

        <button type="button" class="header-lang" data-lang="uk" aria-label="Українська">UK</button>
        <button type="button" class="header-lang" data-lang="en" aria-label="English">EN</button>

  <main>

    <p class="lead" id="leadText">В каждом задании выберите одно правильное предложение на иврите.</p>

    <section class="form" aria-label="Настройки упражнения">
      <label><span id="difficultyLabel">Сложность</span>
        <span class="difficulty" id="levels">

          <button class="level" type="button" data-level="medium">Средний</button>
          <button class="level" type="button" data-level="advanced">Продвинутый</button>
        </span>
      </label>

      <div class="actions" aria-label="AI, добавить, удалить">
        <a class="square ai" id="aiCreate" href="#" target="_blank" rel="noopener">AI</a>
        <button class="square" id="addExercise" type="button" aria-label="Добавить упражнение">+</button>
        <button class="square" id="removeExercise" type="button" aria-label="Удалить упражнение">−</button>
      </div>
      <button id="preflightBtn" type="button" hidden style="margin:4px auto;padding:10px 16px;border:2px solid #0868c9;border-radius:10px;background:#fff;color:#0868c9;font-weight:700;cursor:pointer">Проверить задание AI</button>
      <div class="instructions" id="instructions"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section class="exercise" id="exercise">
      <div class="exercise-head"><h2 id="exerciseTitle"></h2><div class="exercise-meta" id="exerciseMeta"></div></div>
      <div id="tasks"></div>
      <section class="ai-conclusion" id="aiConclusion" aria-label="Заключение ИИ">
        <h3 id="conclusionTitle">Заключение ИИ</h3>
        <div class="conclusion-input" id="conclusionInput" data-placeholder="Здесь появится заключение ИИ" aria-live="polite" aria-readonly="true" role="textbox" tabindex="0"></div>
      </section>
    </section>
  </main>
</div>
<div class="overlay" id="overlay"><aside class="drawer"><div class="drawer-head"><h2 id="drawerTitle">Раздел морфологии</h2><button class="close-menu" id="closeMenu" type="button" aria-label="Закрыть">×</button></div><div class="topics" id="topics"></div></aside></div>

      uk:"СПЕЦІАЛЬНО ДЛЯ ЧИСЛІВНИКІВ: для перевірки складених числівників за потреби використовуй 13, 24 або 35. Іменник має мати однозначний граматичний рід і число. Для 13 перевір форми одиниць і десятків за родом; для 24 і 35 — рід одиниць та узгодження з іменником. Три неправильні варіанти повинні мати ТРИ РІЗНІ безсумнівні помилки числівника або його узгодження. Не створюй варіанти, які відрізняються лише нікудом, шва, наголосом, וְ/וּ чи пунктуацією. ОБОВ'ЯЗКОВО видали подумки весь нікуд, пунктуацію та пробіли з кожного з чотирьох варіантів і порівняй усі шість пар. Якщо будь-яка пара збігається, перепиши хибний варіант так, щоб відрізнялися саме єврейські ЛІТЕРИ, та повтори перевірку. Не вважай допустимі альтернативи помилками. Якщо немає рівно одного правильного й трьох різних неправильних варіантів, зміни речення або число. Перевір correct після остаточного редагування. СУВОРЕ ПРАВИЛО ЛЕКСИКИ: в УСІХ ЧОТИРЬОХ варіантах залишай ОДИН І ТОЙ САМИЙ іменник з АБСОЛЮТНО ОДНАКОВИМИ літерами, нікудом, числом, означеністю та прийменниками. Заборонено замінювати іменник синонімом або іменником іншого роду (наприклад, בְּחִינוֹת на מִבְחָנִים), змінювати дієслово, підмет, додаток, обставини чи порядок слів. Змінюватися можуть ЛИШЕ буквені форми числівника та його складових. Якщо неможливо отримати три різні однозначно хибні форми, обери інше число або створи цілком нове речення, але НЕ змінюй іменник між варіантами. ДОДАТКОВА ПЕРЕВІРКА МОДЕЛЕЙ: 11–19 мають особливі складені форми; не перенось на них механічно правила 21–99. Для 13 з іменником чоловічого роду — שְׁלוֹשָׁה עָשָׂר, жіночого — שְׁלוֹשׁ עֶשְׂרֵה. Для 21–99 десятки не змінюються за родом, а одиниці узгоджуються з іменником: 24 — עֶשְׂרִים וְאַרְבָּעָה (чол.) / עֶשְׂרִים וְאַרְבַּע (жін.); 35 — שְׁלוֹשִׁים וַחֲמִשָּׁה (чол.) / שְׁלוֹשִׁים וְחָמֵשׁ (жін.). Огласовка сполучного ו може змінюватися за фонетичними правилами, але сама по собі не створює окремого варіанта. Перед генерацією зафіксуй одне число, рід іменника й нормативну форму. Кожен хибний варіант має зберігати ТЕ САМЕ числове значення та містити безсумнівну помилку форми або узгодження; не замінюй морфологічну помилку іншим числом. Не оголошуй нормативну форму неправильною. Якщо три безсумнівні різні помилки не вдаються, обери ІНШЕ число, не вигадуй правил.",
      en:"NUMERALS ONLY: where appropriate test compound numerals 13, 24 or 35. Use a noun with unambiguous grammatical gender and number. For 13 verify the gender-dependent unit and teen forms; for 24 and 35 verify the unit's gender form and noun agreement. Create THREE DISTINCT, indisputable numeral/agreement errors in the distractors. Never make distractors that differ only in niqqud, sheva, stress, וְ versus וּ, or punctuation. HARD PRE-OUTPUT CHECK: mentally REMOVE ALL HEBREW VOWEL MARKS, PUNCTUATION AND SPACES from all four options, then compare ALL SIX PAIRS. If ANY pair matches, REWRITE a distractor to differ in actual HEBREW LETTERS, and repeat the entire comparison. Do not mark valid alternative forms wrong. If exactly one correct and three different incorrect variants cannot be obtained, change the sentence or number. Set correct only after the final audit. STRICT LEXICAL INVARIANCE: ALL FOUR options MUST contain the EXACT SAME noun with IDENTICAL Hebrew letters, niqqud, number, definiteness and attached prepositions. NEVER substitute a synonym or noun of another gender (e.g. בְּחִינוֹת versus מִבְחָנִים). Keep the verb, subject, objects, adjuncts and word order identical too. ONLY the LETTER SPELLING of the numeral and its component words may differ between options; no other words may change. If three DISTINCT, unequivocally incorrect numeral forms cannot be produced under this constraint, choose a different number or entirely new base sentence, NOT a different noun in another option. ADDITIONAL VERIFIED PATTERNS: 11–19 use special compound forms; never mechanically apply the 21–99 pattern to them. For 13 with a masculine noun use שְׁלוֹשָׁה עָשָׂר, and with a feminine noun שְׁלוֹשׁ עֶשְׂרֵה. For 21–99 the tens do not inflect for gender; the units agree with the noun: 24 — עֶשְׂרִים וְאַרְבָּעָה (masc.) / עֶשְׂרִים וְאַרְבַּע (fem.); 35 — שְׁלוֹשִׁים וַחֲמִשָּׁה (masc.) / שְׁלוֹשִׁים וְחָמֵשׁ (fem.). Apply the normal phonological pointing rules for conjunctive ו; a niqqud-only difference is not a distinct answer. Fix ONE numerical value, noun gender and normative form before generating options. Every distractor must retain the SAME numerical value and exhibit a genuine, unambiguous numeral-form or agreement error. Do not substitute a different numerical value (e.g. 14 for 13) for a morphological error. Never call a standard gender-matched form wrong. If three distinct indisputable errors cannot be produced, choose ANOTHER number rather than inventing grammar."

  $("aiCreate").addEventListener("click",function(e){
    e.preventDefault();
    if(!currentExercise&&isAdvancedNumerals()){startNumeralLoading();return;}
    if(!currentExercise){if(!currentCategory){$("status").textContent=ui().chooseCategory;return;}window.open("https://chatgpt.com/?q="+encodeURIComponent(promptText()),"_blank","noopener");return;}
    var task=$("tasks").querySelector(".task"),picked=task.querySelector("input:checked");
    if(!picked){$("status").textContent=ui().chooseAnswer;return;}
    var right=Number(task.dataset.correct),selected=Number(picked.value);
    task.querySelectorAll(".choice").forEach(function(choice,index){choice.classList.toggle("correct",index===right);choice.classList.toggle("wrong",index===selected&&index!==right);});
    lastCheckedAnswer=selected;
    if(currentExercise._fixedNumeralId!==undefined){startNumeralReviewLoading(selected);return;}
    activeCheckId="check-"+(++checkSerial)+"-"+Date.now();
    lastConclusionRaw="";lastConclusionLanguage="";
    $("conclusionInput").textContent="";
    $("aiConclusion").classList.remove("open");
    awaitingConclusion=true;
    $("status").textContent=ui().copyConclusion;
    var item=currentExercise.tasks[0],data={checkId:activeCheckId,translation:item.translation,options:item.options,correct:item.correct,selected:selected,isCorrect:selected===item.correct,selectedOption:item.options[selected]};
    var request=feedbackPrompt(data);
    window.open("https://chatgpt.com/?q="+encodeURIComponent(request),"_blank","noopener");
  });
  // Changing the selection invalidates the previous AI check and its copied conclusion.
  $("tasks").addEventListener("change",function(e){
    if(!e.target.matches('input[type="radio"]')||lastCheckedAnswer===null)return;
    if(numeralLoadKind==="review")cancelNumeralLoading();
    lastCheckedAnswer=null;activeCheckId="";awaitingConclusion=false;
    lastConclusionRaw="";lastConclusionLanguage="";
    $("aiConclusion").classList.remove("open");
    $("conclusionInput").textContent="";
    $("tasks").querySelectorAll(".choice").forEach(function(choice){choice.classList.remove("correct","wrong");});
    $("status").textContent=ui().chooseAnswer;
  });
  $("preflightBtn").addEventListener("click",function(){
    if(!pendingNumeralQuiz)return;
    window.open("https://chatgpt.com/?q="+encodeURIComponent(preflightText()),"_blank","noopener");
  });
  $("addExercise").addEventListener("click",async function(){
    if(numeralLoadTimer!==null)return;
    if(!awaitingConclusion&&isAdvancedNumerals()){startNumeralLoading();return;}
    var raw=await clipboard();if(!raw)raw=window.prompt(awaitingConclusion?ui().pasteConclusion:ui().pasteCode,"")||"";
    if(!raw.trim())return;
    if(awaitingConclusion){try{renderConclusion(raw);$("aiConclusion").classList.add("open");$("status").textContent=ui().inserted;awaitingConclusion=false;}catch(_e){$("status").textContent=ui().badConclusion;}return;}
    try{
      if(pendingNumeralQuiz){
        var approved=parsePreflight(raw);
        pendingNumeralQuiz=null;updatePreflight();render(approved);
        $("status").textContent=lang==="uk"?"Попередню перевірку ШІ пройдено. Перевірте відповідь самостійно.":lang==="en"?"AI preflight passed. AI approval is not a guarantee.":"Предварительная проверка ИИ пройдена. Одобрение ИИ не гарантирует отсутствие ошибок.";
        return;
      }
      var data=parseCode(raw);
      if(!validate(data))throw new Error(validationReason(data));
      if(data.category==="numerals"){
        pendingNumeralQuiz=data;updatePreflight();
        $("status").textContent=lang==="uk"?"Натисніть «Перевірити завдання AI», скопіюйте JSON перевірки й натисніть +.":lang==="en"?"Click 'Check exercise AI', copy the audit JSON and press +.":"Нажмите «Проверить задание AI», скопируйте JSON проверки и нажмите +.";
      }else render(data);
    }catch(e){$("status").textContent=ui().badCode+e.message;}
  });
