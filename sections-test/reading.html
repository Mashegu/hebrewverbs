<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
.read-app{width:min(100%,430px);margin:0 auto;padding:10px 10px 34px}
.search{position:relative;width:min(100%,390px);margin:0 auto}
#topicInput{width:100%;height:48px;border:2px solid #111;border-radius:10px;background:#fff;padding:0 44px 0 12px;font-size:17px;text-align:center;outline:none}
#clearBtn{display:none;position:absolute;right:5px;top:5px;width:38px;height:38px;border:0;background:transparent;font-size:25px;cursor:pointer}
.level-wrap{width:min(100%,390px);margin:9px auto 6px;text-align:center}.level-label{font-size:14px;font-weight:700;margin-bottom:6px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.level-btn{min-height:40px;border:1px solid #c7a727;border-radius:10px;background:#fff;padding:5px 6px;font-size:14px;font-weight:700;cursor:pointer}.level-btn.active{background:#fff2a8;border:2px solid #c7a727}.actions{display:flex;align-items:center;justify-content:center;gap:10px;margin:9px auto 12px;width:min(100%,390px)}
.actions a{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border:2px solid #111;border-radius:13px;background:#fff;color:#111;text-decoration:none;font-size:31px;cursor:pointer}
#aiBtn{font-size:28px;text-decoration:underline;text-underline-offset:3px}
.note{width:min(100%,390px);margin:0 auto 10px;text-align:center;font-size:14px;line-height:1.3;color:#555}
#status{min-height:18px;text-align:center;font-size:14px;font-weight:700;margin:0 auto 8px}
.texts{width:min(100%,390px);margin:0 auto}
.topic-title{text-align:center;font-size:20px;font-weight:900;margin:8px 0 10px}
.sentence{border:1px solid #ddd;border-radius:10px;overflow:hidden;margin:0 0 9px;background:#fff}
.he-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 8px 6px}.he{direction:rtl;text-align:center;font-family:David,"Times New Roman",serif;font-size:31px;font-weight:900;line-height:1.15;padding:2px 4px;cursor:pointer}.speak-btn{border:0;background:transparent;font-size:23px;line-height:1;cursor:pointer;padding:4px;flex:0 0 auto}
.tr{text-align:center;background:#efefef;font-size:16px;font-weight:700;line-height:1.25;padding:7px 9px}
.num{font-size:12px;color:#666;text-align:center;padding-top:4px}
</style>

<style id="remove-all-inner-headers">
.mobile-header{display:none!important;}
</style>


<style id="reading-morphology-style">
.morph-token{border-radius:5px;padding:0 2px}.morph-token.marked{background:#fff2a8;cursor:pointer}.morph-word-popup{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.22);align-items:center;justify-content:center;padding:18px}.morph-word-popup.open{display:flex}.morph-word-card{width:min(100%,340px);background:#fff;border:2px solid #111;border-radius:14px;overflow:hidden;text-align:center}.morph-word-tr{padding:14px;font:700 18px/1.25 Arial;border-bottom:1px solid #ddd}.morph-word-he{padding:14px;font:900 34px/1.15 David,"Times New Roman",serif;direction:rtl;cursor:pointer}.morph-word-he:active{background:#fff2a8}
</style>
<style id="standalone-reading-header-style">
.reading-header{width:min(100%,390px);margin:0 auto 12px;position:relative;z-index:20}.reading-header-bar{height:66px;display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 44px;background:#fff2a8;border:2px solid #d1ad28;border-radius:11px;align-items:stretch}.reading-header-title{display:flex;align-items:center;padding:0 12px;color:#0869cf;font-size:20px;font-weight:900}.reading-header-button{border:0;border-left:1px solid #d7c078;background:transparent;font-size:30px;cursor:pointer;color:#111}.reading-header-button.back{color:#0869cf;font-size:38px;font-weight:900}.reading-pop{display:none;position:absolute;top:70px;right:0;max-height:60vh;overflow:auto;width:min(100%,330px);background:#fff;border:1px solid #aaa;border-radius:10px;box-shadow:0 8px 22px #0003;z-index:30}.reading-pop.open{display:block}.reading-pop-title{font-size:17px;font-weight:bold;text-align:center;padding:10px;background:#f2f2f2}.reading-pop button{width:100%;display:block;text-align:left;padding:10px;border:0;border-bottom:1px solid #eee;background:#fff;font-size:16px;cursor:pointer}.reading-pop button.active{background:#fff2a8;font-weight:bold}.reading-pop .reading-db-entry{display:flex;gap:6px;align-items:center;border-bottom:1px solid #ddd}.reading-pop .reading-db-entry button{flex:1;min-width:0}.reading-pop .reading-db-entry .reading-delete{flex:0 0 38px;text-align:center;color:#a00;font-size:22px}.reading-pop .reading-db-entry .reading-level{font-size:12px;color:#555}.reading-pop .reading-empty{padding:12px;text-align:center;color:#666}
</style>
<style id="reading-header-languages-v1">
.reading-header-bar{grid-template-columns:minmax(0,1fr) auto 32px 32px 36px!important}
.reading-header-title{padding:0 5px 0 8px!important;font-size:clamp(13px,3.5vw,18px)!important;min-width:0;white-space:nowrap;overflow:hidden}
.reading-header-languages{display:flex;align-items:center;gap:3px;white-space:nowrap;padding:0 3px;background:#ffff81;align-self:center}
.reading-lang-btn{border:0;background:transparent;color:#888;font:400 clamp(14px,3.7vw,20px)/1 Arial,Helvetica,sans-serif;cursor:pointer;padding:2px 0}
.reading-lang-btn.active{font-weight:900;color:#000}
.reading-header-button{font-size:26px!important}
.reading-header-button.back{font-size:33px!important}
@media(max-width:370px){.reading-header-bar{grid-template-columns:minmax(0,1fr) auto 28px 28px 32px!important}.reading-header-title{font-size:13px!important;padding-left:5px!important}.reading-lang-btn{font-size:14px!important}.reading-header-languages{gap:2px;padding:0 2px}}
</style>
</head>
<body>
<div class="read-app">
<div class="reading-header" id="standaloneReadingHeader"><div class="reading-header-bar"><div class="reading-header-title" id="readingHeaderTitle">Чтение текстов</div><div class="reading-header-languages" role="group" aria-label="Translation language"><button type="button" class="reading-lang-btn" data-reading-lang="ru">RU</button><button type="button" class="reading-lang-btn" data-reading-lang="uk">UK</button><button type="button" class="reading-lang-btn" data-reading-lang="en">EN</button></div><button type="button" class="reading-header-button" id="readingDbToggle" aria-label="База данных" aria-expanded="false">☰</button><button type="button" class="reading-header-button" id="readingMorphToggle" aria-label="Морфология" aria-expanded="false">✓</button><button type="button" class="reading-header-button back" id="readingBack" aria-label="Назад">❮</button></div><div class="reading-pop" id="readingDbPop"></div><div class="reading-pop" id="readingMorphPop"><div class="reading-pop-title" data-i18n="morph">Раздел морфологии</div><button data-morph="none">Без выбора</button><button data-morph="noun">Существительные</button><button data-morph="adjective">Прилагательные</button><button data-morph="numeral">Числительные</button><button data-morph="pronoun">Местоимения</button><button data-morph="verb">Глаголы</button><button data-morph="adverb">Наречия</button><button data-morph="preposition">Предлоги</button><button data-morph="conjunction">Союзы</button></div></div>
  <div class="search">
    <input id="topicInput" autocomplete="off" placeholder="Введите тему, например: банк">
    <button id="clearBtn" type="button">×</button>
  </div>
  <div class="level-wrap">
    <div class="level-label" id="levelLabel">Сложность</div>
    <div class="levels">
      <button type="button" class="level-btn active" data-level="beginner" id="levelBeginner">Начальный</button>
      <button type="button" class="level-btn" data-level="intermediate" id="levelIntermediate">Средний</button>
      <button type="button" class="level-btn" data-level="advanced" id="levelAdvanced">Продвинутый</button>
    </div>
  </div>
  <div class="actions">
    <a id="aiBtn" href="#" target="_blank" rel="noopener noreferrer">AI</a>
    <a id="addBtn" href="#">+</a>
    <a id="removeBtn" href="#">−</a>
  </div>
  <div class="note" id="note"></div>
  <div id="status"></div>
  <div class="texts" id="texts"></div>
</div>
<div class="morph-word-popup" id="morphWordPopup"><div class="morph-word-card"><div class="morph-word-tr" id="morphWordTr"></div><div class="morph-word-he" id="morphWordHe" lang="he" dir="rtl"></div></div></div>
<script>
(function(){
"use strict";
/* READING_AUDIO_COPIED_FROM_PREP_EXAMPLES_V8 */
var LANG="ru";
try{LANG=new URLSearchParams(window.location.search).get("lang")||localStorage.getItem("hebrewUnifiedLang")||"ru";}catch(_e){}
if(!/^(ru|uk|en)$/.test(LANG))LANG="ru";
var LEVEL="beginner";
var KEY="hebrewReadingTextsDB_V1";
var ACTIVE_MORPH="none";
var CURRENT_RECORD=null,CURRENT_KEY="";
var UI={
 ru:{ph:"Введите тему, например: банк",note:"Выберите сложность, введите тему и нажмите AI. В ответе появится блок кода со значком копирования. Скопируйте код и нажмите +.",added:"Текст добавлен.",removed:"Текст удалён.",bad:"Не удалось распознать код из буфера.",paste:"Вставьте скопированный код READING_TEXTS и нажмите OK:",empty:"Введите тему.",level:"Сложность",beginner:"Начальный",intermediate:"Средний",advanced:"Продвинутый"},
 uk:{ph:"Введіть тему, наприклад: банк",note:"Виберіть складність, введіть тему й натисніть AI. У відповіді з’явиться блок коду зі значком копіювання. Скопіюйте код і натисніть +.",added:"Текст додано.",removed:"Текст видалено.",bad:"Не вдалося розпізнати код з буфера.",paste:"Вставте скопійований код READING_TEXTS і натисніть OK:",empty:"Введіть тему.",level:"Складність",beginner:"Початковий",intermediate:"Середній",advanced:"Просунутий"},
 en:{ph:"Enter a topic, for example: bank",note:"Choose a level, enter a topic, and press AI. The answer will contain a code block with a copy icon. Copy the code and press +.",added:"Text added.",removed:"Text deleted.",bad:"Could not recognize the clipboard code.",paste:"Paste the copied READING_TEXTS code and press OK:",empty:"Enter a topic.",level:"Difficulty",beginner:"Beginner",intermediate:"Intermediate",advanced:"Advanced"}
};
function norm(v){return String(v||"").toLocaleLowerCase().replace(/\s+/g," ").trim()}
function db(){try{var x=JSON.parse(localStorage.getItem(KEY)||"{}");return x&&typeof x==="object"&&!Array.isArray(x)?x:{}}catch(_e){return {}}}
function save(x){try{localStorage.setItem(KEY,JSON.stringify(x))}catch(_e){}}
function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function levelOf(rec){
 var l=String(rec&&rec.level||"beginner");
 return /^(beginner|intermediate|advanced)$/.test(l)?l:"beginner";
}
function baseTopicKey(key,rec){
 var explicit=String(rec&&rec._topicKey||"").trim();
 if(explicit)return explicit;
 return String(key||"").replace(/@@(?:beginner|intermediate|advanced)$/,"");
}
function storageKey(topicKey,level){
 return String(topicKey||"").trim()+"@@"+String(level||"beginner");
}
function sameTopic(q,key,rec){
 var w=norm(q),t=rec&&rec.topic||{},base=baseTopicKey(key,rec);
 return norm(base)===w||norm(t.ru)===w||norm(t.uk)===w||norm(t.en)===w||norm(t.he)===w;
}
function find(q,level){
 var d=db(),ks=Object.keys(d),wantLevel=level||LEVEL;
 for(var i=0;i<ks.length;i++){
   var k=ks[i],r=d[k]||{};
   if(sameTopic(q,k,r)&&levelOf(r)===wantLevel){
     return {key:k,data:r,topicKey:baseTopicKey(k,r)};
   }
 }
 /* Если выбранного уровня нет, другой уровень не подставляем. */
 return null;
}
function label(rec,key){
 var t=rec&&rec.topic||{};
 return String(t[LANG]||t.ru||t.uk||t.en||t.he||key||"");
}
function morphWordsForSentence(x){return x&&Array.isArray(x.words)?x.words:[]}
function renderHebrewSentence(x){
 var words=morphWordsForSentence(x);
 if(!words.length)return esc(x&&x.he||"");
 return words.map(function(w){var he=String(w&&w.he||"");var pos=String(w&&w.pos||"").toLowerCase();var tr=String(w&&(w[LANG]||w.ru||w.uk||w.en)||"");var marked=ACTIVE_MORPH!=="none"&&pos===ACTIVE_MORPH;return '<span class="morph-token '+(marked?'marked':'')+'" data-pos="'+esc(pos)+'" data-he="'+esc(he)+'" data-tr="'+esc(tr)+'">'+esc(he)+'</span>'}).join(' ');
}
function render(rec,key){
 CURRENT_RECORD=rec||null;CURRENT_KEY=String(key||"");
 var box=document.getElementById("texts");
 if(!rec){box.innerHTML="";return}
 var rows=Array.isArray(rec.sentences)?rec.sentences:[];
 var html='<div class="topic-title">'+esc(label(rec,key))+'</div>';
 rows.forEach(function(x,i){
   if(!x)return;
   var tr=String(x[LANG]||x.ru||x.uk||x.en||"");
   html+='<div class="sentence"><div class="num">'+(i+1)+'</div><div class="he-row"><button type="button" class="speak-btn" aria-label="🔊" data-he="'+esc(x.he||"")+'">🔊</button><div class="he" lang="he" dir="rtl" data-he="'+esc(x.he||"")+'">'+renderHebrewSentence(x)+'</div></div><div class="tr">'+esc(tr)+'</div></div>';
 });
 box.innerHTML=html;
}

var LEVEL_INSTRUCTIONS={"uk": {"advanced": "Просунутий рівень: природні довші речення, різноманітна лексика й граматика, зв’язний текст приблизно рівня B1–B2.", "intermediate": "Середній рівень: речення помірної довжини, корисна повсякденна лексика й трохи складніші конструкції, приблизно A2–B1.", "beginner": "Початковий рівень: дуже зрозумілі короткі речення, частотна лексика й проста граматика, приблизно A1–A2."}, "en": {"advanced": "Advanced level: natural, longer sentences, varied vocabulary and grammar, and a coherent text at approximately B1–B2 level.", "intermediate": "Intermediate level: moderately long sentences, useful everyday vocabulary and somewhat more complex structures, approximately A2–B1.", "beginner": "Beginner level: very clear, short sentences, frequent vocabulary and simple grammar, approximately A1–A2."}};
function levelInstruction(){
 if(LEVEL_INSTRUCTIONS[LANG])return LEVEL_INSTRUCTIONS[LANG][LEVEL];
 if(LEVEL==="advanced")return "Продвинутый уровень: естественные более длинные предложения, разнообразная лексика и грамматика, связный текст примерно уровня B1–B2.";
 if(LEVEL==="intermediate")return "Средний уровень: предложения умеренной длины, полезная повседневная лексика и немного более сложные конструкции, примерно A2–B1.";
 return "Начальный уровень: очень понятные короткие предложения, частотная лексика и простая грамматика, примерно A1–A2.";
}
var PROMPT_TEXT={"ru": ["Для учебного раздела \"Чтение текстов\" создай ровно 10 коротких, естественных и полезных предложений на тему: ", "Каждое предложение должно быть на современном иврите с правильными огласовками.", "Для каждого предложения добавь массив words: каждое слово отдельно с огласовками, переводами RU/UK/EN и pos. pos только: noun, adjective, numeral, pronoun, verb, adverb, preposition, conjunction или other.", "Дай точные переводы каждого предложения на русский, украинский и английский.", "Предложения должны образовывать связный мини-текст по теме и подходить для практики чтения.", "ОБЯЗАТЕЛЬНО верни ответ в одном Markdown-блоке ```javascript, чтобы у блока в интерфейсе был стандартный значок копирования.", "Вне блока кода не пиши ничего.", "Формат строго такой:", "    ... ровно 10 объектов ..."], "uk": ["Для навчального розділу «Читання текстів» створи рівно 10 коротких, природних і корисних речень на тему: ", "Кожне речення має бути сучасним івритом із правильними знаками оголосовування (нікудом).", "Для кожного речення додай масив words: кожне слово окремо зі знаками оголосовування, перекладами RU/UK/EN і pos. Для pos дозволено лише: noun, adjective, numeral, pronoun, verb, adverb, preposition, conjunction або other.", "Дай точні переклади кожного речення російською, українською й англійською.", "Речення мають утворювати зв’язний мінітекст на задану тему й підходити для практики читання.", "ОБОВ’ЯЗКОВО поверни відповідь в одному блоці коду Markdown ```javascript, щоб блок мав стандартний значок копіювання в інтерфейсі.", "Поза блоком коду нічого не пиши.", "Формат має бути саме таким:", "    ... рівно 10 об’єктів ..."], "en": ["For the learning section “Reading texts”, create exactly 10 short, natural and useful sentences on the topic: ", "Each sentence must be in Modern Hebrew with correct niqqud.", "For each sentence, add a words array: each word separately with niqqud, RU/UK/EN translations and pos. The only allowed pos values are: noun, adjective, numeral, pronoun, verb, adverb, preposition, conjunction or other.", "Provide accurate Russian, Ukrainian and English translations of each sentence.", "The sentences must form a coherent mini-text on the topic and be suitable for reading practice.", "You MUST return the answer in a single Markdown ```javascript code block so that the interface shows its standard copy icon.", "Do not write anything outside the code block.", "Use exactly this format:", "    ... exactly 10 objects ..."]};
function promptFor(q){
 var p=PROMPT_TEXT[LANG];
 return [
 p[0]+q+".",
 levelInstruction(),
 p[1],
 p[2],
 p[3],
 p[4],
 p[5],
 p[6],
 p[7],
 'READING_TEXTS["key"] = {',
 '  topic:{he:"...",ru:"...",uk:"...",en:"..."},',
 '  level:"'+LEVEL+'",',
 '  sentences:[',
 '    {he:"...",ru:"...",uk:"...",en:"...",words:[{he:"...",ru:"...",uk:"...",en:"...",pos:"noun|adjective|numeral|pronoun|verb|adverb|preposition|conjunction|other"}]},',
 p[8],
 '  ]',
 '};'
 ].join("\n");
}
function refresh(){
 var inp=document.getElementById("topicInput"),q=String(inp.value||"").trim(),hit=find(q);
 document.getElementById("clearBtn").style.display=q?"block":"none";
 document.getElementById("levelLabel").textContent=UI[LANG].level;
 document.getElementById("levelBeginner").textContent=UI[LANG].beginner;
 document.getElementById("levelIntermediate").textContent=UI[LANG].intermediate;
 document.getElementById("levelAdvanced").textContent=UI[LANG].advanced;
 document.querySelectorAll(".level-btn").forEach(function(b){b.classList.toggle("active",b.dataset.level===LEVEL)});
 var ai=document.getElementById("aiBtn");
 ai.href=q?"https://chatgpt.com/?q="+encodeURIComponent(promptFor(q)):"#";
 document.getElementById("note").textContent=UI[LANG].note;
 document.getElementById("status").textContent="";
 render(hit&&hit.data,hit&&hit.key);
}
async function clip(){
 var readers=[];
 try{if(navigator.clipboard&&navigator.clipboard.readText)readers.push(function(){return navigator.clipboard.readText()})}catch(_e){}
 try{if(parent&&parent!==window&&parent.navigator&&parent.navigator.clipboard&&parent.navigator.clipboard.readText)readers.push(function(){return parent.navigator.clipboard.readText()})}catch(_e){}
 for(var i=0;i<readers.length;i++){try{var t=await readers[i]();if(String(t||"").trim())return String(t)}catch(_e){}}
 return "";
}
function parse(text){
 text=String(text||"").trim().replace(/^```(?:javascript|js)?\s*/i,"").replace(/\s*```$/,"");
 var m=text.match(/READING_TEXTS\s*\[\s*["']([^"']+)["']\s*\]\s*=\s*([\s\S]*?)\s*;?\s*$/);
 if(!m)return null;
 try{
   var obj=(new Function("return ("+m[2]+")"))();
   if(!obj||!Array.isArray(obj.sentences)||obj.sentences.length!==10)return null;
   for(var i=0;i<obj.sentences.length;i++)if(!obj.sentences[i]||!String(obj.sentences[i].he||"").trim())return null;
   if(!obj.topic||typeof obj.topic!=="object")obj.topic={ru:m[1],uk:m[1],en:m[1],he:""};
   return {key:m[1],data:obj};
 }catch(_e){return null}
}
var activeAudio=null;
function cleanHebrewText(text){
  return String(text || "")
    .replace(/<[^>]*>/g, " ")
    .replace(/\s*\([^)]*\)\s*/g, " ")
    .replace(/[^\u0590-\u05FF\s׳״־-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function stopCurrentAudio(){
  try{
    if(activeAudio){
      activeAudio.pause();
      activeAudio.currentTime=0;
    }
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  }catch(e){}
  activeAudio=null;
}
function speakWithBrowser(clean){
  if(!window.speechSynthesis)return;
  try{
    var utter=new SpeechSynthesisUtterance(clean);
    utter.lang="he-IL";
    utter.rate=0.85;
    utter.pitch=1;
    utter.volume=1;
    var voices=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[];
    var heVoice=voices.find(function(v){
      return String(v.lang||"").toLowerCase().indexOf("he")===0;
    });
    if(heVoice)utter.voice=heVoice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }catch(e){}
}
function speakHebrewWord(text){
  var clean=cleanHebrewText(text);
  if(!clean)return;
  stopCurrentAudio();
  var url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=he&q="+
            encodeURIComponent(clean);
  var audio=new Audio(url);
  audio.preload="auto";
  activeAudio=audio;
  audio.addEventListener("error",function(){
    speakWithBrowser(clean);
  },{once:true});
  try{
    var p=audio.play();
    if(p&&typeof p.catch==="function"){
      p.catch(function(){speakWithBrowser(clean);});
    }
  }catch(e){
    speakWithBrowser(clean);
  }
}

window.getReadingAiUrl=function(topicKey,level){
 var oldLevel=LEVEL;
 if(/^(beginner|intermediate|advanced)$/.test(level||""))LEVEL=level;
 var q=String(topicKey||"").trim();
 var url=q?"https://chatgpt.com/?q="+encodeURIComponent(promptFor(q)):"#";
 LEVEL=oldLevel;
 return url;
};

window.openReadingTopicLevel=function(topicKey,level){
 if(/^(beginner|intermediate|advanced)$/.test(level||""))LEVEL=level;
 var inp=document.getElementById("topicInput");
 if(inp)inp.value=String(topicKey||"");
 refresh();
};
window.openReadingRecord=function(rec,topicKey,level){
 if(/^(beginner|intermediate|advanced)$/.test(level||""))LEVEL=level;
 var inp=document.getElementById("topicInput");if(inp)inp.value=String(topicKey||"");
 document.querySelectorAll(".level-btn").forEach(function(b){b.classList.toggle("active",b.dataset.level===LEVEL)});
 document.getElementById("clearBtn").style.display=topicKey?"block":"none";
 document.getElementById("status").textContent="";
 render(rec,topicKey);
};
window.addEventListener("message",function(e){var m=e.data||{};if(m.type==="OPEN_READING_RECORD"){if(m.record)window.openReadingRecord(m.record,m.topicKey,m.level);else window.openReadingTopicLevel(m.topicKey,m.level);}if(m.type==="SET_READING_MORPH"){ACTIVE_MORPH=String(m.morph||"none");render(CURRENT_RECORD,CURRENT_KEY);}});
window.applyCleanLanguage=function(l){
 if(!/^(ru|uk|en)$/.test(l))l="ru";
 LANG=l;document.documentElement.lang=l;if(window.updateStandaloneReadingHeader)window.updateStandaloneReadingHeader();
 document.getElementById("topicInput").placeholder=UI[l].ph;
 refresh();
};
document.querySelectorAll(".level-btn").forEach(function(b){

document.getElementById("clearBtn").addEventListener("click",function(){document.getElementById("topicInput").value="";refresh();document.getElementById("topicInput").focus()});
document.getElementById("addBtn").addEventListener("click",function(e){
 e.preventDefault();
 (async function(){
   var text=await clip(),st=document.getElementById("status");
   if(!String(text||"").trim())text=window.prompt(UI[LANG].paste,"")||"";
   var p=parse(text);
   if(!p){st.textContent=UI[LANG].bad;return}
   var d=db();
   p.data.level=LEVEL;
   p.data._topicKey=p.key;
   d[storageKey(p.key,LEVEL)]=p.data;
   save(d);
   document.getElementById("topicInput").value=p.key;
   st.textContent=UI[LANG].added;
   render(p.data,p.key);
 })();
});

(function(){
 var dbBtn=document.getElementById('readingDbToggle'),morphBtn=document.getElementById('readingMorphToggle'),dbPop=document.getElementById('readingDbPop'),morphPop=document.getElementById('readingMorphPop');
 var morphNames={ru:['Раздел морфологии','Без выбора','Существительные','Прилагательные','Числительные','Местоимения','Глаголы','Наречия','Предлоги','Союзы'],uk:['Розділ морфології','Без вибору','Іменники','Прикметники','Числівники','Займенники','Дієслова','Прислівники','Прийменники','Сполучники'],en:['Morphology','No selection','Nouns','Adjectives','Numerals','Pronouns','Verbs','Adverbs','Prepositions','Conjunctions']};
 function close(){dbPop.classList.remove('open');morphPop.classList.remove('open');dbBtn.setAttribute('aria-expanded','false');morphBtn.setAttribute('aria-expanded','false')}
 function fillDb(){var data=db(),keys=Object.keys(data);dbPop.innerHTML='<div class="reading-pop-title">'+({ru:'В базе данных',uk:'У базі даних',en:'In database'}[LANG])+'</div>';if(!keys.length){dbPop.innerHTML+='<div class="reading-empty">'+({ru:'Нет сохранённых текстов',uk:'Немає збережених текстів',en:'No saved texts'}[LANG])+'</div>';return}keys.sort(function(a,b){return a.localeCompare(b)}).forEach(function(key){var rec=data[key],topic=baseTopicKey(key,rec),row=document.createElement('div');row.className='reading-db-entry';var open=document.createElement('button');open.type='button';open.textContent=label(rec,topic);var level=document.createElement('span');level.className='reading-level';level.textContent=' ('+({beginner:'A1',intermediate:'A2',advanced:'B1'}[levelOf(rec)]||'')+')';open.appendChild(level);open.addEventListener('click',function(){LEVEL=levelOf(rec);document.getElementById('topicInput').value=topic;refresh();close()});var del=document.createElement('button');del.type='button';del.className='reading-delete';del.textContent='−';del.addEventListener('click',function(){var d=db();delete d[key];save(d);fillDb();refresh()});row.appendChild(open);row.appendChild(del);dbPop.appendChild(row)})}
 dbBtn.addEventListener('click',function(e){e.stopPropagation();var open=!dbPop.classList.contains('open');close();if(open){fillDb();dbPop.classList.add('open');dbBtn.setAttribute('aria-expanded','true')}});
 morphBtn.addEventListener('click',function(e){e.stopPropagation();var open=!morphPop.classList.contains('open');close();if(open){morphPop.classList.add('open');morphBtn.setAttribute('aria-expanded','true')}});
 morphPop.querySelectorAll('button[data-morph]').forEach(function(b){b.addEventListener('click',function(){ACTIVE_MORPH=b.dataset.morph;morphPop.querySelectorAll('button').forEach(function(x){x.classList.toggle('active',x===b)});render(CURRENT_RECORD,CURRENT_KEY);close()})});
 document.getElementById('readingBack').addEventListener('click',function(){close();if(window.parent!==window){try{window.parent.postMessage({type:'READING_BACK'},'*');if(window.parent.showSection){window.parent.showSection('home');return}}catch(e){}}if(history.length>1)history.back();else window.location.href='index.html'});
 document.addEventListener('click',function(e){if(!e.target.closest('#standaloneReadingHeader'))close()});
 document.querySelectorAll('[data-reading-lang]').forEach(function(btn){btn.addEventListener('click',function(){var lang=btn.getAttribute('data-reading-lang');try{localStorage.setItem('hebrewUnifiedLang',lang)}catch(e){}window.applyCleanLanguage(lang)})});
 window.updateStandaloneReadingHeader=function(){document.getElementById('readingHeaderTitle').textContent={ru:'Чтение текстов',uk:'Читання текстів',en:'Reading texts'}[LANG];document.querySelectorAll('[data-reading-lang]').forEach(function(btn){var active=btn.getAttribute('data-reading-lang')===LANG;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});var arr=morphNames[LANG],nodes=morphPop.children;nodes[0].textContent=arr[0];for(var i=1;i<nodes.length;i++)nodes[i].textContent=arr[i]};
 window.updateStandaloneReadingHeader();
})();

window.applyCleanLanguage(LANG);
})();
