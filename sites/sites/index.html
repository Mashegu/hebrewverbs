<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Простой конструктор сайта 4.6</title>
<style>
:root{--blue:#2563eb;--blue2:#1d4ed8;--bg:#eef3f9;--text:#172033;--muted:#64748b;--line:#d8e1ed;--card:#fff}
*{box-sizing:border-box}
html,body,button,input,select{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.35;font-weight:400}
h1,h2,h3,h4,h5,h6,.brand,.menu button,strong,b{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.35;font-weight:700}
body{margin:0;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
button{border:0;border-radius:10px;padding:10px 16px;min-height:42px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
button:hover{background:var(--blue2)}
button.secondary{background:#e7edf6;color:var(--text)}
button.success{background:#15803d}
.wrap{width:min(1160px,calc(100% - 24px));margin:20px auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(15,23,42,.09);overflow:hidden}
.head{padding:22px 26px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:#fff}
.head h1{margin:0 0 6px;font-size:16px}.head p{margin:0}
.choose{padding:25px;max-width:780px}
.choose h2{margin:0 0 8px}
.search{width:100%;padding:11px 13px;border:1px solid #b9c6d8;border-radius:10px;margin:12px 0 9px}
select{width:100%;min-height:350px;border:1px solid #b9c6d8;border-radius:10px;padding:5px;background:#fff}
.choose-actions{display:flex;justify-content:flex-end;margin-top:12px}
.editor-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 14px;background:#172033;color:#fff}
.editor-toolbar strong{margin-right:auto}
.editor-toolbar button{background:#fff;color:#172033}
.editor-toolbar .success{background:#15803d;color:#fff}
.site{background:#fff;min-height:650px}
.site-nav{display:flex;align-items:center;gap:18px;padding:15px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}
.brand{font-weight:800;color:var(--blue);margin-right:auto}
.menu{display:flex;flex-wrap:wrap;gap:7px}
.menu button{background:transparent;color:var(--text);padding:8px 10px;min-height:auto}
.menu button.active{background:#dbeafe;color:#1d4ed8}
.page{display:none;padding:38px 34px;min-height:560px}
.page.active{display:block}
.hero{background:linear-gradient(135deg,#eff6ff,#dbeafe)}
.hero h1{font-size:16px;margin:0 0 12px}
.page h2{font-size:16px;margin:0 0 12px}
.page-intro{font-size:16px;color:#334155;max-width:850px}
 .about-lines{
  width:100%;
  margin-top:8px;
}
.about-line{
  display:block;
  width:100%;
  min-height:30px;
  margin:0;
  padding:5px 0;
  border:0;
  border-bottom:1px solid #edf1f5;
  background:transparent;
  color:var(--text);
  font-size:16px;
  line-height:1.35;
  font-weight:400;
}
.about-line:last-child{
  margin-top:10px;
}
.about-line:focus{
  outline:1px dashed var(--blue);
  outline-offset:1px;
  background:#fffbe8;
}

.about-field-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  min-height:30px;
  padding:5px 0;
  border-bottom:1px solid #edf1f5;
}
.about-field-label{
  flex:0 0 auto;
}
.about-small-field{
  display:inline-block;
  min-width:190px;
  max-width:240px;
  min-height:27px;
  padding:2px 6px;
  border:1px solid #9ca3af;
  border-radius:3px;
  background:#fff;
}
.about-years-field{
  min-width:65px;
  max-width:90px;
}
@media(max-width:560px){
  .about-field-row{flex-wrap:wrap}
  .about-small-field{min-width:150px}
}

.page-help{
  margin-top:10px;
  color:var(--muted);
  font-size:16px;
  font-weight:400;
}

.row-editor{
  margin-top:8px;
}
.edit-row{
  position:relative;
  padding:3px 70px 4px 0;
  border-bottom:1px solid #edf1f5;
}
.edit-row-title,
.edit-row-text{
  display:block;
  min-height:20px;
  margin:0;
  padding:0;
  background:transparent;
  border:0;
  border-radius:0;
  line-height:1.28;
}
.edit-row-title{
  font-weight:700;
  margin-bottom:1px;
}
.edit-row-title:focus,
.edit-row-text:focus,
.add-row-line:focus{
  outline:1px dashed var(--blue);
  outline-offset:1px;
  background:#fffbe8;
}
.remove-row{
  position:absolute;
  top:3px;
  right:0;
  padding:0;
  min-height:auto;
  background:transparent;
  color:#b91c1c;
  border-radius:0;
  font-weight:400;
  line-height:1.28;
}
.remove-row:hover{
  background:transparent;
  color:#7f1d1d;
  text-decoration:underline;
}
.add-row-line{
  min-height:24px;
  margin-top:2px;
  padding:2px 0;
  border:0;
  border-bottom:1px solid #cbd5e1;
  color:var(--text);
  line-height:1.28;
}
.add-row-line:empty::before{
  content:attr(data-placeholder);
  color:var(--muted);
}
@media(max-width:760px){
  .edit-row{padding-right:60px}
}
.price-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:max-content;
  max-width:100%;
  min-height:38px;
  padding-right:0;
}
.price-row .remove-row{
  position:static;
  flex:0 0 auto;
  margin-left:2px;
  white-space:nowrap;
}
.price-row .edit-row-title{
  flex:0 1 auto;
  width:max-content;
  min-width:140px;
  max-width:calc(100% - 240px);
  margin:0;
  font-weight:400;
}
.price-entry{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  min-width:120px;
  justify-content:flex-end;
}
.price-value{
  display:inline-block;
  min-width:72px;
  min-height:24px;
  padding:1px 4px;
  border:0;
  border-bottom:1px solid #94a3b8;
  text-align:right;
  font-weight:400;
}
.price-value:empty::before{
  content:"цена";
  color:var(--muted);
}
.price-currency{
  min-width:16px;
  font-weight:700;
}
@media(max-width:560px){
  .price-row{gap:8px}
  .price-entry{min-width:92px}
  .price-value{min-width:48px}
}
.contact-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:max-content;
  max-width:100%;
  min-height:40px;
  padding-top:4px;
  padding-right:68px;
  padding-bottom:4px;
}
.contact-row .edit-row-title{
  flex:0 0 165px;
  margin:0;
  font-weight:400;
  text-align:left;
}
.contact-value{
  flex:0 1 340px;
  min-height:31px;
  padding:4px 7px;
  border:1px solid #9ca3af;
  border-radius:3px;
  background:#fff;
  line-height:1.3;
}
.contact-value:empty::before{
  content:attr(data-placeholder);
  color:var(--muted);
}
@media(max-width:560px){
  .contact-row{align-items:flex-start;flex-direction:column;gap:3px;width:100%;padding-right:60px}
  .contact-row .edit-row-title{flex:auto;width:100%;text-align:left}
  .contact-value{flex:auto;width:100%;min-height:34px}
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.card{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.card h3{margin:0 0 8px}
.user-guide{max-width:920px;margin-top:22px;padding:0;background:transparent;border:0;box-shadow:none}
.user-guide h2{margin:0 0 12px;font-size:16px;font-weight:700}
.user-guide p{margin:0 0 10px;font-size:16px;font-weight:400;line-height:1.45}
.editable{outline:1px dashed #60a5fa;outline-offset:3px;border-radius:3px;cursor:text}
.editable:focus{outline:2px solid var(--blue);background:#fffbe8}
.hint{padding:9px 14px;background:#fff7ed;color:#9a3412;border-bottom:1px solid #fed7aa}
.footer{padding:20px;text-align:center;background:#172033;color:#cbd5e1}
.site.readonly .editable,
.site.readonly [contenteditable]{
  outline:none!important;
  background:transparent!important;
  cursor:default;
}
.site.readonly .remove-row,
.site.readonly .add-row-line{
  display:none!important;
}
.site.readonly .page-help{
  display:none;
}

@media(max-width:760px){
 .site-nav{align-items:flex-start;flex-direction:column}.brand{margin-right:0}
 .page{padding:26px 18px}.hero h1{font-size:16px}
}
</style>
</head>

<div id="siteRoot"></div>
</section>
</main>

<script>
"use strict";
const DB=window.PROFESSIONS_DATABASE.professions;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const norm=v=>String(v||"").toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let profession=null;
let currentProjectId="";
let editingMode=true;

function fillProfessions(query=""){
 const q=norm(query), select=$("#professionSelect"), current=select.value;
 const list=[...DB].filter(p=>!q||norm(p.name).includes(q)||(p.aliases||[]).some(a=>norm(a).includes(q)))
   .sort((a,b)=>a.name.localeCompare(b.name,"ru",{sensitivity:"base"}));
 select.innerHTML=list.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
 if(current && [...select.options].some(o=>o.value===current))select.value=current;
}
function serviceDescription(p,i){
 return (p.serviceDescriptions&&p.serviceDescriptions[i])||
 `Услуга «${p.services[i]}» подбирается с учётом задачи клиента и желаемого результата.`;
}
function pageButton(id,label){return `<button type="button" data-page="${id}">${label}</button>`}
function editable(tag,text,extra=""){return `<${tag} class="editable" contenteditable="true" ${extra}>${esc(text)}</${tag}>`}

function editorRow(title,text){
 return `<div class="edit-row">
   <div class="edit-row-title editable" contenteditable="true">${esc(title)}</div>
   <div class="edit-row-text editable" contenteditable="true">${esc(text)}</div>
   <button type="button" class="remove-row">Удалить</button>
 </div>`;
}
function priceEditorRow(title,price=""){
 return `<div class="edit-row price-row">
   <div class="edit-row-title editable" contenteditable="true">${esc(title)}</div>
   <div class="price-entry">
    <div class="edit-row-text price-value editable" contenteditable="true">${esc(price)}</div>
    <span class="price-currency">₪</span>
   </div>
   <button type="button" class="remove-row">Удалить</button>
 </div>`;
}
function priceEditorRowHtml(titleHtml,priceHtml){
 return `<div class="edit-row price-row">
   <div class="edit-row-title editable" contenteditable="true">${titleHtml||""}</div>
   <div class="price-entry">
    <div class="edit-row-text price-value editable" contenteditable="true">${priceHtml||""}</div>
    <span class="price-currency">₪</span>
   </div>
   <button type="button" class="remove-row">Удалить</button>
 </div>`;
}
function contactEditorRow(title,value="",placeholder=""){
 return `<div class="edit-row contact-row">
   <div class="edit-row-title editable" contenteditable="true">${esc(title)}</div>
   <div class="edit-row-text contact-value editable" contenteditable="true" data-placeholder="${esc(placeholder)}">${esc(value)}</div>
   <button type="button" class="remove-row">Удалить</button>
 </div>`;
}
function contactEditorRowHtml(titleHtml,valueHtml,placeholder=""){
 return `<div class="edit-row contact-row">
   <div class="edit-row-title editable" contenteditable="true">${titleHtml||""}</div>
   <div class="edit-row-text contact-value editable" contenteditable="true" data-placeholder="${esc(placeholder)}">${valueHtml||""}</div>
   <button type="button" class="remove-row">Удалить</button>
 </div>`;
}
function addRowLine(type){
 const placeholders={
   services:"Добавить услугу и нажать Enter",
   prices:"Добавить услугу с ценой и нажать Enter",
   reviews:"Добавить отзыв и нажать Enter",
   contacts:"Добавить контакт и нажать Enter"
 };
 return `<div class="add-row-line" contenteditable="true" data-type="${type}" data-placeholder="${placeholders[type]}"></div>`;
}
function defaultRowText(type,title){
 if(type==="services")return `Опишите услугу «${title}»: что входит в работу и какой результат получает клиент.`;
 if(type==="prices")return "";
 if(type==="reviews")return "";
 return "";
}
function renderRowEditors(p){
 const services=Array.isArray(p.services)?p.services:[];
 $("#servicesEditor").innerHTML=
   services.map((s,i)=>editorRow(s,serviceDescription(p,i))).join("")+
   addRowLine("services");

 $("#pricesEditor").innerHTML=
   services.map(s=>priceEditorRow(s,"")).join("")+
   addRowLine("prices");

 $("#reviewsEditor").innerHTML=
   editorRow("Имя клиента","")+
   editorRow("Имя клиента","")+
   addRowLine("reviews");

 $("#contactsEditor").innerHTML=
   contactEditorRow("Телефон 1:","+972(0)","+972(0)")+
   contactEditorRow("Телефон 2:","+972(0)","+972(0)")+
   contactEditorRow("WhatsApp:","+972(0)","+972(0)")+
   contactEditorRow("Электронная почта:","","")+
   contactEditorRow("Город или район:","","")+
   contactEditorRow("Адрес:","","")+
   contactEditorRow("Часы работы:","","")+
   addRowLine("contacts");

 bindRowEditors();
}
function bindRowEditors(){
 $$(".remove-row").forEach(btn=>{
   btn.onclick=()=>btn.closest(".edit-row")?.remove();
 });
 $$(".add-row-line").forEach(line=>{
   line.onkeydown=e=>{
     if(e.key!=="Enter")return;
     e.preventDefault();
     const title=line.textContent.replace(/\u00a0/g," ").trim();
     if(!title)return;
     const type=line.dataset.type;
     const newRow=type==="prices"
       ? priceEditorRow(title,"")
       : type==="contacts"
         ? contactEditorRow(title.endsWith(":")?title:`${title}:`,"","")
         : editorRow(title,defaultRowText(type,title));
     line.insertAdjacentHTML("beforebegin",newRow);
     line.textContent="";
     bindRowEditors();
     const next=document.querySelector(`.add-row-line[data-type="${type}"]`);
     next?.focus();
   };
 });
}

 const services=p.services||[];
 const aboutLines=[

   "Я внимательно отношусь к каждому клиенту, заранее обсуждаю задачу и условия работы, стараюсь выполнять работу качественно и в согласованные сроки. Здесь вы можете дополнить текст своими преимуществами, опытом и особенностями подхода к работе."
 ];
 const html=`

  </nav>

  <section class="page hero active" data-page-id="home">
   ${editable("h1",`${p.name} — профессиональные услуги`)}

    <h2>Руководство пользователя</h2>
    <p>После выбора профессии откроется готовый шаблон сайта. В верхнем меню последовательно выбирайте нужный раздел и заменяйте заранее подготовленные тексты своими данными.</p>
    <p><strong>О себе.</strong> Укажите своё имя, профессию, опыт работы и расскажите, почему клиенту стоит обратиться к вам.</p>
    <p><strong>Цены.</strong> Впишите стоимость услуг или объясните, от чего зависит окончательная цена.</p>
    <p><strong>Услуги.</strong> Проверьте названия и описания услуг, удалите ненужное и исправьте текст под свою работу.</p>
    <p><strong>Отзывы.</strong> Замените примеры настоящими отзывами клиентов и укажите их имена.</p>
    <p><strong>Контакты.</strong> Добавьте телефон, WhatsApp, электронную почту, город, адрес и часы работы.</p>
    <p>После заполнения всех разделов нажмите кнопку <strong>«Сохранить»</strong>. Для получения готового файла сайта используйте кнопку <strong>«Скачать HTML»</strong>.</p>
   </div>
  </section>

  <section class="page" data-page-id="about">
   <h2>О себе</h2>
   <div id="aboutEditor" class="about-lines">
    <div class="about-field-row">
     <span class="about-field-label">Имя:</span>
     <div class="about-small-field editable" contenteditable="true"></div>
    </div>
    <div class="about-line editable" contenteditable="true">${esc(aboutLines[0])}</div>
    <div class="about-field-row">
     <span class="about-field-label">Опыт работы (лет):</span>
     <div class="about-small-field about-years-field editable" contenteditable="true"></div>
    </div>
    <div class="about-line editable" contenteditable="true">${esc(aboutLines[1])}</div>
   </div>
   <p class="page-help">Исправьте текст под себя и нажмите кнопку «Сохранить» вверху страницы.</p>
  </section>

  <section class="page" data-page-id="prices">
   <h2>Цены</h2>
   <p class="page-help">Впишите цену перед знаком ₪, удалите ненужное или добавьте новую услугу внизу.</p>
   <div id="pricesEditor" class="row-editor"></div>
  </section>

  <section class="page" data-page-id="services">
   <h2>Услуги</h2>
   <p class="page-help">Исправьте текст, удалите ненужное или добавьте новую услугу внизу.</p>
   <div id="servicesEditor" class="row-editor"></div>
  </section>

  <section class="page" data-page-id="reviews">
   <h2>Отзывы</h2>
   <p class="page-help"></p>
   <div id="reviewsEditor" class="row-editor"></div>
  </section>

  <section class="page" data-page-id="contacts">
   <h2>Контакты</h2>
   <p class="page-help">Исправьте контакты, удалите ненужное или добавьте новую строку.</p>
   <div id="contactsEditor" class="row-editor"></div>
  </section>
  <footer class="footer editable" contenteditable="true">© 2026 ${esc(p.name)}. Все права защищены.</footer>
 </div>`;
 $("#siteRoot").innerHTML=html;
 renderRowEditors(p);
 bindMenu();
 if(restoreSaved)restoreProject();
}
function bindMenu(){
 const buttons=$$(".menu button");
 buttons.forEach(b=>b.onclick=()=>{
  buttons.forEach(x=>x.classList.toggle("active",x===b));
  $$(".page").forEach(p=>p.classList.toggle("active",p.dataset.pageId===b.dataset.page));
  window.scrollTo({top:0,behavior:"smooth"});
  setTimeout(()=>document.querySelector(".page.active .add-row-line")?.focus(),120);
 });
 buttons[0]?.classList.add("active");
}
function createProjectId(){
 const randomPart=(window.crypto&&crypto.randomUUID)
   ? crypto.randomUUID()
   : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
 return `${profession?.id||"project"}-${randomPart}`;
}
function projectKey(){
 return currentProjectId?`simpleSiteV4_4:project:${currentProjectId}`:"";
}
function projectListKey(){
 return "simpleSiteV4_4:project-list";
}
function rememberProject(){
 if(!profession||!currentProjectId)return;
 let list=[];
 try{ list=JSON.parse(localStorage.getItem(projectListKey())||"[]"); }catch(error){ list=[]; }
 list.unshift({
   projectId:currentProjectId,
   professionId:profession.id,
   professionName:profession.name,
   createdAt:new Date().toISOString()
 });
 localStorage.setItem(projectListKey(),JSON.stringify(list.slice(0,100)));
}
function showEditor(){
 $("#editorTitle").textContent=`Редактирование: ${profession.name}`;
 $("#chooser").classList.add("hidden");
 $("#editor").classList.remove("hidden");
 window.scrollTo(0,0);
}
function openSelected(){
 const id=$("#professionSelect").value;
 profession=DB.find(p=>p.id===id);
 if(!profession)return alert("Выберите профессию.");

 // Каждый выбор профессии создаёт НОВЫЙ отдельный проект.
 // В него один раз копируются только данные выбранной профессии.
 currentProjectId=createProjectId();
 buildSite(profession,false);

 // Сразу фиксируем исходную копию проекта. Дальше база на него не влияет.
 try{
   localStorage.setItem(projectKey(),JSON.stringify(collectProjectData()));
   rememberProject();
 }catch(error){
   console.warn("Не удалось создать новый проект:",error);
 }

 setEditingMode(true);
 showEditor();
}

function setEditingMode(enabled){
 editingMode=enabled;
 const site=$("#siteRoot .site");
 if(!site)return;

 site.classList.toggle("readonly",!enabled);

 site.querySelectorAll(".editable").forEach(el=>{
   el.setAttribute("contenteditable",enabled?"true":"false");
 });

 site.querySelectorAll(".add-row-line").forEach(el=>{
   el.setAttribute("contenteditable",enabled?"true":"false");
 });

 site.querySelectorAll(".remove-row").forEach(btn=>{
   btn.disabled=!enabled;
 });

 $("#saveProject").classList.toggle("hidden",!enabled);
 $("#editProject").classList.toggle("hidden",enabled);

 const hint=$(".hint");
 if(hint){
   hint.textContent=enabled
     ?"Нажмите на текст и исправьте его. После завершения нажмите «Сохранить»."
     :"Страница сохранена. Для внесения изменений нажмите «Редактировать».";
 }
}
function editProject(){
 setEditingMode(true);
 setTimeout(()=>{
   const activePage=document.querySelector(".page.active");
   const firstEditable=activePage?.querySelector(".editable");
   firstEditable?.focus();
 },80);
}

function collectRows(editorId){
 return [...document.querySelectorAll(`#${editorId} .edit-row`)].map(row=>({
   title:row.querySelector(".edit-row-title")?.innerHTML||"",
   text:row.querySelector(".edit-row-text")?.innerHTML||""
 }));
}
function renderSavedRows(editorId,type,rows){
 const editor=document.getElementById(editorId);
 if(!editor||!Array.isArray(rows))return;
 editor.innerHTML=rows.map(row=>
   type==="prices"
     ? priceEditorRowHtml(row.title,row.text)
     : type==="contacts"
       ? contactEditorRowHtml(row.title,row.text,"")
       : editorRowHtml(row.title,row.text)
 ).join("")+addRowLine(type);
}
function editorRowHtml(titleHtml,textHtml){
 return `<div class="edit-row">
   <div class="edit-row-title editable" contenteditable="true">${titleHtml||""}</div>
   <div class="edit-row-text editable" contenteditable="true">${textHtml||""}</div>
   <button type="button" class="remove-row">Удалить</button>
 </div>`;
}
function collectProjectData(){
 const root=$("#siteRoot");
 return {
   format:"simple-site-user-data",
   version:5,
   storageModel:"new-project-on-each-profession-selection",
   projectId:currentProjectId,
   professionId:profession?.id||"",
   content:{
     brand:root.querySelector(".brand")?.innerHTML||"",
     homeTitle:root.querySelector('[data-page-id="home"] h1')?.innerHTML||"",
     homeIntro:root.querySelector('[data-page-id="home"] .page-intro')?.innerHTML||"",
     aboutName:root.querySelector("#aboutEditor .about-small-field:not(.about-years-field)")?.innerHTML||"",
     aboutYears:root.querySelector("#aboutEditor .about-years-field")?.innerHTML||"",
     aboutLines:[...root.querySelectorAll("#aboutEditor .about-line")].map(el=>el.innerHTML),
     footer:root.querySelector(".footer")?.innerHTML||""
   },
   rows:{
     prices:collectRows("pricesEditor"),
     services:collectRows("servicesEditor"),
     reviews:collectRows("reviewsEditor"),
     contacts:collectRows("contactsEditor")
   }
 };
}
function applyProjectData(data){
 if(!data||data.format!=="simple-site-user-data"||data.professionId!==profession?.id)return false;
 const root=$("#siteRoot");
 const content=data.content||{};
 const setHtml=(selector,value)=>{
   const el=root.querySelector(selector);
   if(el&&typeof value==="string")el.innerHTML=value;
 };
 setHtml(".brand",content.brand);
 setHtml('[data-page-id="home"] h1',content.homeTitle);
 setHtml('[data-page-id="home"] .page-intro',content.homeIntro);
 const aboutEditor=root.querySelector("#aboutEditor");
 if(aboutEditor){
   const nameField=aboutEditor.querySelector(".about-small-field:not(.about-years-field)");
   const yearsField=aboutEditor.querySelector(".about-years-field");
   if(nameField && typeof content.aboutName==="string")nameField.innerHTML=content.aboutName;
   if(yearsField && typeof content.aboutYears==="string")yearsField.innerHTML=content.aboutYears;
   if(Array.isArray(content.aboutLines)){
     const lineElements=aboutEditor.querySelectorAll(".about-line");
     content.aboutLines.forEach((line,index)=>{
       if(lineElements[index])lineElements[index].innerHTML=line||"";
     });
   }else if(typeof content.about==="string" && content.about){
     // Перенос старого проекта: разбиваем прежнюю общую ячейку на отдельные строки.
     const temp=document.createElement("div");
     temp.innerHTML=content.about;
     const text=temp.innerText.split(/\n+/).map(x=>x.trim()).filter(Boolean);
     if(text.length){
       const lineElements=aboutEditor.querySelectorAll(".about-line");
       text.forEach((line,index)=>{
         if(lineElements[index])lineElements[index].innerHTML=esc(line);
       });
     }
   }
 }
 setHtml(".footer",content.footer);
 const rows=data.rows||{};
 if(Array.isArray(rows.prices))renderSavedRows("pricesEditor","prices",rows.prices);
 if(Array.isArray(rows.services))renderSavedRows("servicesEditor","services",rows.services);
 if(Array.isArray(rows.reviews))renderSavedRows("reviewsEditor","reviews",rows.reviews);
 if(Array.isArray(rows.contacts))renderSavedRows("contactsEditor","contacts",rows.contacts);
 bindRowEditors();
 return true;
}
function saveProject(){
 if(!profession)return;
 localStorage.setItem(projectKey(),JSON.stringify(collectProjectData()));
 setEditingMode(false);
 alert("Проект сохранён. Все удаления, добавления и изменения относятся только к вашему проекту этой профессии.");
}
function restoreProject(){
 // В версии 4.4 новый проект не загружает старые сохранения.
 // Каждый выбор профессии создаёт самостоятельную копию.
 setEditingMode(true);
}

function downloadHtml(){
 const site=$("#siteRoot").innerHTML;
 const css=[...document.styleSheets].map(s=>{try{return [...s.cssRules].map(r=>r.cssText).join("\n")}catch(e){return""}}).join("\n");
 const temp=document.createElement("div");
 temp.innerHTML=site;
 temp.querySelectorAll(".remove-row,.add-row-line,.page-help").forEach(x=>x.remove());
 temp.querySelectorAll("[contenteditable]").forEach(x=>x.removeAttribute("contenteditable"));
 temp.querySelectorAll(".editable").forEach(x=>x.classList.remove("editable"));
 const clean=temp.innerHTML;
 const out=`<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(profession?.name||"Мой сайт")}</title><style>${css}</style></head><body><main class="wrap"><section class="panel">${clean}</section></main><script>document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.menu button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.dataset.pageId===b.dataset.page));});<\/script></body></html>`;
 const blob=new Blob([out],{type:"text/html;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-site.html";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$("#professionSearch").oninput=e=>fillProfessions(e.target.value);
$("#professionSearch").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();openSelected()}};
$("#professionSelect").onchange=openSelected;
$("#professionSelect").ondblclick=openSelected;
$("#openEditor").onclick=openSelected;
$("#changeProfession").onclick=()=>{$("#editor").classList.add("hidden");$("#chooser").classList.remove("hidden");window.scrollTo(0,0)};
$("#saveProject").onclick=saveProject;
$("#editProject").onclick=editProject;
$("#downloadHtml").onclick=downloadHtml;
fillProfessions();
</script>
</body>
